function passRepeatOneUnroll(sir, blocks, stats){
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  let k=0;
  for(const n of sir){
    if(!n.live || n.op!=="control_repeat") continue;
    const c=_constFromBlocks(n.inputs.TIMES, blocks);
    if(!c.ok || Math.floor(Number(c.v))!==1) continue;
    const sub=n.inputs.SUBSTACK;
    if(!Array.isArray(sub)||typeof sub[1]!=="string"){ n.live=false; k++; continue; }
    let pred=null;
    for(const p of sir) if(p.live && p.next===n.id) pred=p;
    if(pred) pred.next=sub[1];
    if(pred && blocks[pred.id]) blocks[pred.id].next=sub[1];
    let tail=sub[1]; let g=0;
    while(byId[tail] && byId[tail].next && g++<100000) tail=byId[tail].next;
    if(byId[tail]){ byId[tail].next=n.next; if(blocks[tail]) blocks[tail].next=n.next; }
    n.live=false; k++; stats.folded++;
  }
  return k;
}

function passBooleanGVN(sir, blocks, stats){
  let k=0;
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="operator_equals"){
      const a=_constFromBlocks(n.inputs.OPERAND1, blocks);
      const b=_constFromBlocks(n.inputs.OPERAND2, blocks);
      if(a.ok && b.ok){
        const v=(a.v==b.v)?1:0;
        n.op="math_number"; n.fields={NUM:[String(v),null]}; n.inputs={};
        blocks[n.id]={opcode:"math_number",next:null,parent:n.parent,inputs:{},fields:{NUM:[String(v),null]},shadow:false,topLevel:false};
        k++; stats.folded++;
      }
    }
    if(n.op==="operator_and"||n.op==="operator_or"){
      const a=_constFromBlocks(n.inputs.OPERAND1, blocks);
      const b=_constFromBlocks(n.inputs.OPERAND2, blocks);
      if(a.ok && b.ok){
        const av=Number(a.v)?1:0, bv=Number(b.v)?1:0;
        const v=n.op==="operator_and"?(av&bv):(av|bv);
        n.op="math_number"; n.fields={NUM:[String(v),null]}; n.inputs={};
        blocks[n.id]={opcode:"math_number",next:null,parent:n.parent,inputs:{},fields:{NUM:[String(v),null]},shadow:false,topLevel:false};
        k++; stats.folded++;
      }
    }
  }
  return k;
}

function passFullGVN(sir, blocks, stats){
  const pure=new Set(["math_number","text","operator_add","operator_subtract","operator_multiply","operator_divide","operator_mod","operator_equals","operator_gt","operator_lt","operator_and","operator_or","operator_not","operator_join","operator_length","operator_letter_of","operator_contains","operator_random","operator_mathop","data_variable"]);
  const keyOf=(n)=>{
    if(n.op==="math_number") return "n:"+n.fields.NUM?.[0];
    if(n.op==="text") return "t:"+n.fields.TEXT?.[0];
    if(n.op==="data_variable") return "v:"+n.fields.VARIABLE?.[0];
    if(n.op==="operator_mathop") return "m:"+n.fields.OPERATOR?.[0]+":"+JSON.stringify(n.inputs.NUM);
    const parts=[n.op];
    for(const k of Object.keys(n.inputs||{}).sort()){
      const inp=n.inputs[k];
      if(Array.isArray(inp) && typeof inp[1]==="string") parts.push(k+"="+inp[1]);
      else parts.push(k+"=?");
    }
    for(const k of Object.keys(n.fields||{}).sort()) parts.push("F"+k+"="+JSON.stringify(n.fields[k]?.[0]));
    return parts.join("|");
  };
  const table=new Map();
  const rewrite=new Map();
  let hits=0;
  for(const n of sir){
    if(!n.live || !pure.has(n.op)) continue;
    if(n.op==="data_variable") continue;
    const key=keyOf(n);
    if(table.has(key)){
      const rep=table.get(key);
      rewrite.set(n.id, rep);
      n.live=false; hits++; stats.cse++; stats.dead++;
    } else table.set(key, n.id);
  }
  if(hits){
    for(const n of sir){
      if(!n.live) continue;
      for(const [k,inp] of Object.entries(n.inputs||{})){
        if(!Array.isArray(inp)) continue;
        for(let i=1;i<inp.length;i++){
          if(typeof inp[i]==="string" && rewrite.has(inp[i])){
            inp[i]=rewrite.get(inp[i]);
          }
        }
      }
    }
  }
  stats.gvn=(stats.gvn||0)+hits;
  return hits;
}

function passMemoryPtr(sir, blocks, stats){
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  let killed=0, promoted=0;
  const allocs=[];
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="data_setvariableto"){
      const v=n.fields.VARIABLE?.[0]||"";
      if(v.endsWith("_start")||v.endsWith("_end")||v.endsWith("_cur")||v==="heap_ptr"){
        /* tracked below */
      }
    }
    if(n.op==="data_addtolist"||n.op==="data_replaceitemoflist"){
      const list=n.fields.LIST?.[0];
      if(list==="heap_ptr") allocs.push(n);
    }
  }
  const ptrVars=new Set();
  for(const n of sir){
    if(!n.live) continue;
    const v=n.fields.VARIABLE?.[0];
    if(v && (v.endsWith("_start")||v.endsWith("_end")||v.endsWith("_cur"))){
      ptrVars.add(v.replace(/_(start|end|cur)$/,""));
    }
  }
  for(const base of ptrVars){
    let uses=0, defs=0;
    const related=[];
    for(const n of sir){
      if(!n.live) continue;
      const v=n.fields.VARIABLE?.[0]||"";
      if(v===base||v===base+"_start"||v===base+"_end"||v===base+"_cur"){
        related.push(n);
        if(n.op==="data_setvariableto"||n.op==="data_changevariableby") defs++;
      }
      for(const inp of Object.values(n.inputs||{})){
        if(Array.isArray(inp) && typeof inp[1]==="string" && blocks[inp[1]] && blocks[inp[1]].opcode==="data_variable"){
          const vn=blocks[inp[1]].fields.VARIABLE?.[0]||"";
          if(vn===base||vn===base+"_cur"||vn===base+"_start"||vn===base+"_end") uses++;
        }
      }
      if(n.op==="data_replaceitemoflist"||n.op==="data_itemoflist"){
        const idx=n.inputs.INDEX;
        if(Array.isArray(idx) && typeof idx[1]==="string" && blocks[idx[1]] && blocks[idx[1]].opcode==="data_variable"){
          const vn=blocks[idx[1]].fields.VARIABLE?.[0]||"";
          if(vn===base+"_cur") uses++;
        }
      }
    }
    if(uses===0 && defs>0){
      for(const n of related){ if(n.live){ n.live=false; killed++; stats.dead++; } }
      trace("opt", "mem: unused ptr killed", base);
    } else if(uses>0 && defs>0){
      let onlyConst=true;
      let constStart=null;
      for(const n of related){
        if(n.op==="data_setvariableto" && (n.fields.VARIABLE?.[0]===base+"_start"||n.fields.VARIABLE?.[0]===base)){
          const c=_constFromBlocks(n.inputs.VALUE, blocks);
          if(c.ok && c.kind==="num") constStart=c.v;
          else onlyConst=false;
        }
      }
      if(onlyConst && constStart!==null && uses<=3){
        promoted++;
        stats.mem=(stats.mem||0)+1;
      }
    }
  }
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="data_deletealloflist" && n.fields.LIST?.[0]==="heap_ptr"){
      let heapUse=false;
      for(const m of sir){
        if(!m.live||m===n) continue;
        if((m.op==="data_addtolist"||m.op==="data_replaceitemoflist"||m.op==="data_itemoflist"||m.op==="data_deletealloflist") && m.fields.LIST?.[0]==="heap_ptr"){
          if(m!==n) heapUse=true;
        }
      }
      if(!heapUse){ n.live=false; killed++; stats.dead++; }
    }
  }
  stats.mem=(stats.mem||0)+killed+promoted;
  return killed+promoted;
}

function passInlineCollapse(sir, blocks, stats){
  let k=0;
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  const procedureNodes=new Set();
  const visited=new Set();
  const visitProcedureChain=(start)=>{
    const pending=[start];
    while(pending.length){
      let id=pending.pop(),guard=0;
      while(id&&byId[id]&&guard++<20000&&!visited.has(id)){
        const node=byId[id]; visited.add(id); procedureNodes.add(id);
        for(const key of ["SUBSTACK","SUBSTACK2"]){
          const sub=node.inputs&&node.inputs[key];
          if(Array.isArray(sub)&&typeof sub[1]==="string"&&!visited.has(sub[1])) pending.push(sub[1]);
        }
        id=node.next;
      }
    }
  };
  for(const node of sir) if(node.live&&node.op==="procedures_definition"&&node.next) visitProcedureChain(node.next);
  for(const n of sir){
    if(!n.live || n.op!=="data_setvariableto" || procedureNodes.has(n.id)) continue;
    const v=n.fields.VARIABLE?.[0];
    if(!v || v.startsWith("__scrit_") || !(v.startsWith("__")||v.startsWith("_t")||v.startsWith("tmp")||/_arg\d+$/.test(v)||v.startsWith("__cf_"))) continue;
    let uses=0; let useSites=[];
    let readByProcedure=false;
    for(const m of sir){
      if(!m.live) continue;
      for(const [ik,inp] of Object.entries(m.inputs||{})){
        if(!Array.isArray(inp)) continue;
        for(let i=1;i<inp.length;i++){
          if(typeof inp[i]==="string" && blocks[inp[i]] && blocks[inp[i]].opcode==="data_variable" && blocks[inp[i]].fields.VARIABLE?.[0]===v){
            if(procedureNodes.has(m.id)) readByProcedure=true;
            uses++; useSites.push({m,ik,i,repId:inp[i]});
          }
        }
      }
      if(m!==n && m.op==="data_setvariableto" && m.fields.VARIABLE?.[0]===v) uses+=10;
    }
    if(readByProcedure) continue;
    if(uses===1 && useSites.length===1){
      const site=useSites[0];
      const val=n.inputs.VALUE;
      if(Array.isArray(val)){
        site.m.inputs[site.ik][site.i]=typeof val[1]==="string"?val[1]:site.m.inputs[site.ik][site.i];
        if(val[0]===1||val[0]===3){
          site.m.inputs[site.ik]=val.slice();
        }
        n.live=false; k++; stats.dead++; stats.inline=(stats.inline||0)+1;
      }
    } else if(uses===0){
      n.live=false; k++; stats.dead++; stats.inline=(stats.inline||0)+1;
    }
  }
  for(const n of sir){
    if(!n.live || n.op!=="data_setvariableto") continue;
    const v=n.fields.VARIABLE?.[0];
    const c=_constFromBlocks(n.inputs.VALUE, blocks);
    if(!v||!c.ok) continue;
    let next=n.next?byId[n.next]:null;
    if(next && next.live && next.op==="data_setvariableto" && next.fields.VARIABLE?.[0]===v){
      n.live=false; k++; stats.dead++; stats.inline=(stats.inline||0)+1;
    }
  }
  return k;
}

function runPass(name, fn, sir, blocks, stats, banditOn){
  const before=countLive(sir);
  const t0=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  const result=fn(sir, blocks, stats);
  const after=countLive(sir);
  const dt=Math.max(0.01, ((typeof performance!=="undefined"&&performance.now)?performance.now():Date.now())-t0);
  const killed=Math.max(0, before-after);
  const reward=killed*2 + (typeof result==="number"?Math.min(result,50)*0.1:0) + (killed>0?1:0)/dt;
  if(banditOn) banditUpdate(name, reward);
  trace("opt", "pass:"+name, "Δlive="+(before-after)+" dt="+dt.toFixed(2)+"ms reward="+reward.toFixed(3));
  return result;
}

function optimizeSIR(sir, blocks, level){
  const stats={folded:0, dead:0, pulses:0, cse:0, ssa:0, egraph:0, smt:0, linear:0, sat:0, loops:0, strength:0, unroll:0, gvn:0, mem:0, inline:0};
  const before=countLive(sir);
  const banditOn=typeof OPT_BANDIT!=="undefined" && OPT_BANDIT;
  if(!sir.length) return {sir, stats};
  trace("opt", "SIR start", "live="+before+" level=O"+level+(banditOn?" BANDIT":""));

  const allPasses=["dce","egraph","smt","strength","gvn","pulse","linear","loops","inline","mem","unroll","empty","sat2"];
  let selected=null;
  if(banditOn){
    selected=new Set(banditSelect(allPasses, Math.min(10, allPasses.length)));
    selected.add("dce");
    selected.add("egraph");
    selected.add("gvn");
    selected.add("inline");
    selected.add("mem");
    trace("opt", "bandit select", [...selected].join(","));
  } else {
    selected=new Set(allPasses);
  }

  const doPass=(name)=>!banditOn || selected.has(name);

  if(doPass("dce")) runPass("dce", (s,b,st)=>{ st.dead+=reachabilityDCE(s); return st.dead; }, sir, blocks, stats, banditOn);
  if(level<1) return {sir, stats};

  const egraph=new EGraph();
  const smt=new SMTLite();
  const pulses=new PulseSystem();

  if(doPass("egraph")||doPass("smt")||doPass("pulse")){
    for(const n of sir){
      if(!n.live) continue;
      if(n.op==="math_number"){
        const v=Number(n.fields.NUM?.[0]);
        egraph.add(n.id,"math_number",[], Number.isFinite(v)?v:null);
        n.eclass=egraph.find(n.id);
      } else if(n.op==="text"){
        egraph.add(n.id,"text",[], null);
        n.eclass=egraph.find(n.id);
      } else if(/^operator_/.test(n.op)){
        const kids=[];
        for(const key of ["NUM1","NUM2","OPERAND1","OPERAND2","OPERAND","FROM","TO","STRING1","STRING2","STRING","LETTER"]){
          const inp=n.inputs[key];
          if(Array.isArray(inp) && typeof inp[1]==="string") kids.push(inp[1]);
        }
        egraph.add(n.id, n.op, kids, null);
        n.eclass=egraph.find(n.id);
      }
    }
  }

  const ssa=constructSSA(sir, level);
  stats.ssa=ssa.phis.length;
  trace("opt", "SSA construct", "phis="+stats.ssa);

  if(doPass("smt")){
    runPass("smt", (s,b,st)=>{
      for(const n of s){
        if(!n.live) continue;
        if(n.op==="data_setvariableto"){
          const v=n.fields.VARIABLE?.[0];
          const c=_constFromBlocks(n.inputs.VALUE, b);
          if(v && c.ok && c.kind==="num") smt.setEq(v, c.v);
        }
      }
      smt.propagate(egraph);
      st.smt=smt.eq.size;
      return st.smt;
    }, sir, blocks, stats, banditOn);
  }

  if(doPass("egraph")){
    runPass("egraph", (s,b,st)=>{
      const maxSat=level>=3?256:level>=2?96:32;
      st.sat=egraph.saturate(maxSat);
      st.egraph=egraph.nodes.size;
      for(const n of s){
        if(!n.live) continue;
        if(!/^operator_/.test(n.op)) continue;
        const root=egraph.find(n.id);
        const cv=egraph.getConst(root);
        if(cv!==null && typeof cv==="number" && Number.isFinite(cv)){
          n.op="math_number";
          n.fields={NUM:[String(cv),null]};
          n.inputs={};
          n.folded=cv;
          st.folded++;
          b[n.id]={opcode:"math_number",next:null,parent:n.parent,inputs:{},fields:{NUM:[String(cv),null]},shadow:false,topLevel:false};
        }
      }
      return st.folded;
    }, sir, blocks, stats, banditOn);
  }

  if(doPass("strength")) runPass("strength", (s,b,st)=>{ const r=passStrengthReduction(s,b,st); st.strength+=r; return r; }, sir, blocks, stats, banditOn);
  if(doPass("gvn")){
    runPass("gvn", (s,b,st)=>{ passBooleanGVN(s,b,st); return passFullGVN(s,b,st); }, sir, blocks, stats, banditOn);
  }

  if(doPass("pulse")){
    runPass("pulse", (s,b,st)=>{
      const byId=Object.fromEntries(s.map(n=>[n.id,n]));
      function guardOf(n){
        let p=n.parent; let g=0;
        while(p && g++<100){
          const pn=byId[p]; if(!pn) break;
          if(pn.op==="control_if"||pn.op==="control_if_else"||pn.op==="control_repeat_until"){
            const cond=pn.inputs.CONDITION;
            if(Array.isArray(cond) && typeof cond[1]==="string") return cond[1];
          }
          p=pn.parent;
        }
        return null;
      }
      for(const n of s){ if(n.live) pulses.emit(n, guardOf(n)); }
      for(const n of s){
        if(!n.live) continue;
        if(n.op!=="control_if" && n.op!=="control_if_else") continue;
        const cond=n.inputs.CONDITION;
        let cv=null;
        if(Array.isArray(cond) && typeof cond[1]==="string"){
          cv=egraph.getConst(cond[1]);
          if(cv===null){
            const blk=b[cond[1]];
            if(blk && blk.opcode==="math_number") cv=Number(blk.fields.NUM?.[0]);
            if(blk && blk.opcode==="operator_equals"){
              const a=_constFromBlocks(blk.inputs.OPERAND1, b);
              const c=_constFromBlocks(blk.inputs.OPERAND2, b);
              if(a.ok && c.ok) cv=(a.v==c.v)?1:0;
            }
          }
        }
        if(cv===0){
          const killChain=(head)=>{ let id=head; let k=0; while(id && byId[id] && k++<10000){ byId[id].live=false; st.pulses++; id=byId[id].next; } };
          if(Array.isArray(n.inputs.SUBSTACK) && n.inputs.SUBSTACK[1]) killChain(n.inputs.SUBSTACK[1]);
          if(n.op==="control_if_else" && Array.isArray(n.inputs.SUBSTACK2) && n.inputs.SUBSTACK2[1]) n.next=n.inputs.SUBSTACK2[1];
          n.live=false; st.pulses++;
        } else if(cv!==null && cv!==0 && Number.isFinite(Number(cv))){
          if(n.op==="control_if_else" && Array.isArray(n.inputs.SUBSTACK2) && n.inputs.SUBSTACK2[1]){
            let id=n.inputs.SUBSTACK2[1]; let k=0;
            while(id && byId[id] && k++<10000){ byId[id].live=false; st.pulses++; id=byId[id].next; }
          }
          if(Array.isArray(n.inputs.SUBSTACK) && n.inputs.SUBSTACK[1]) n.next=n.inputs.SUBSTACK[1];
          n.live=false; st.pulses++;
        }
      }
      st.pulses+=pulses.resolve(egraph);
      return st.pulses;
    }, sir, blocks, stats, banditOn);
  }

  if(doPass("linear")) runPass("linear", (s,b,st)=>{ const r=solveLinearChains(s,b,level); st.linear+=r; return r; }, sir, blocks, stats, banditOn);
  if(doPass("loops")) runPass("loops", (s,b,st)=>{ const r=summarizeAndCollapseLoops(s,b,level,st); st.loops+=r; return r; }, sir, blocks, stats, banditOn);
  if(doPass("inline")) runPass("inline", (s,b,st)=>passInlineCollapse(s,b,st), sir, blocks, stats, banditOn);
  if(doPass("mem")) runPass("mem", (s,b,st)=>passMemoryPtr(s,b,st), sir, blocks, stats, banditOn);
  if(doPass("unroll")) runPass("unroll", (s,b,st)=>{ const r=passRepeatOneUnroll(s,b,st); passWaitZeroElim(s,b,st); st.unroll+=r; return r; }, sir, blocks, stats, banditOn);
  if(doPass("empty")) runPass("empty", (s,b,st)=>passEmptyControlElim(s,st), sir, blocks, stats, banditOn);

  if(level>=2 && doPass("gvn")){
    runPass("gvn", (s,b,st)=>passFullGVN(s,b,st), sir, blocks, stats, banditOn);
  }

  if(level>=3 && doPass("sat2")){
    runPass("sat2", (s,b,st)=>{
      st.sat+=egraph.saturate(128);
      const lastSet=new Map();
      for(const n of s){
        if(!n.live) continue;
        if(n.op==="data_setvariableto"){
          const v=n.fields.VARIABLE?.[0];
          const c=_constFromBlocks(n.inputs.VALUE, b);
          if(v && c.ok){
            const key=v+"="+JSON.stringify(c.v);
            const prev=lastSet.get(v);
            if(prev && prev.key===key){ n.live=false; st.dead++; }
            else lastSet.set(v,{key,node:n});
          } else if(v) lastSet.set(v,{key:null,node:n});
        } else if(n.op==="data_changevariableby"){
          const v=n.fields.VARIABLE?.[0]; if(v) lastSet.delete(v);
        } else if(/^control_/.test(n.op)) lastSet.clear();
      }
      st.linear+=solveLinearChains(s,b,level);
      st.loops+=summarizeAndCollapseLoops(s,b,level,st);
      passInlineCollapse(s,b,st);
      passMemoryPtr(s,b,st);
      passFullGVN(s,b,st);
      passEmptyControlElim(s,st);
      st.dead+=reachabilityDCE(s);
      return 1;
    }, sir, blocks, stats, banditOn);
  }

  stats.dead+=reachabilityDCE(sir);
  const after=countLive(sir);
  trace("opt", "SIR done", "live "+before+"→"+after+" Δ"+(before-after)+(banditOn?" [bandit]":""));
  return {sir, stats};
}

function linkTimeDCE_source(source, fileFunctions){
  // Remove unused def bodies from expanded source before compile when OPT_LEVEL>=0
  // fileFunctions: { alias: { fnName: {args, expression} } }
  // Collect call sites alias.fn(
  const used=new Set();
  const callRe=/([A-Za-z_]\w*)\.([A-Za-z_]\w*)\s*\(/g; let m;
  while((m=callRe.exec(source))) used.add(m[1]+"."+m[2]);
  // Also bare calls after macro expansion may appear as inlined — nothing to strip here
  return {source, used};
}

async function prefetchRemotesForSource(source){
  const re=/@import\s+["'](https?:\/\/[^"']+)["']\s+as\s+(\w+)/g;
  let m; const jobs=[];
  while((m=re.exec(source))){
    const url=m[1];
    if(!REMOTE_CACHE.has(url)) jobs.push(fetchRemoteScrit(url));
  }
  if(jobs.length) await Promise.all(jobs);
}


const COMPILE_CACHE=new Map();
const COMPILE_CACHE_MAX=24;
let WASM_HASH=null;
let WASM_MEM=null;
const WASM_B64="AGFzbQEAAAABBgFgAX8BfwMCAQAFAwEACAcRAgZtZW1vcnkCAARoYXNoAAAKOwE5AQJ/QcW78oh4IQJBACEBAkADQCABIABPDQEgAiABLQAAc0GTg4AIbCECIAFBAWohAQwACwsgAg8L";
(async function initScritWasm(){
  try{
    const bytes=Uint8Array.from(atob(WASM_B64),c=>c.charCodeAt(0));
    const {instance}=await WebAssembly.instantiate(bytes);
    WASM_HASH=instance.exports.hash;
    WASM_MEM=instance.exports.memory;
    if(typeof trace==="function") try{trace("link","wasm","fnv hash ready");}catch(_){}
  }catch(e){ WASM_HASH=null; }
})();
function scritFastHash(str){
  const s=String(str||"");
  if(WASM_HASH&&WASM_MEM){
    try{
      const enc=new TextEncoder();
      const data=enc.encode(s);
      const need=(data.length+65535)>>16;
      if(WASM_MEM.buffer.byteLength<need*65536) WASM_MEM.grow(need-((WASM_MEM.buffer.byteLength)>>16));
      new Uint8Array(WASM_MEM.buffer).set(data,0);
      return (WASM_HASH(data.length)>>>0).toString(16);
    }catch(_){}
  }
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h.toString(16);
}
function lightDCE_blocks(blocks){
  const reach=new Set();
  const stack=[];
  for(const [id,b] of Object.entries(blocks)){
    if(b&&(b.topLevel||(b.opcode&&String(b.opcode).startsWith("event_")))) stack.push(id);
  }
  while(stack.length){
    const id=stack.pop(); if(reach.has(id)) continue; reach.add(id);
    const b=blocks[id]; if(!b) continue;
    if(b.next) stack.push(b.next);
    for(const inp of Object.values(b.inputs||{})){
      if(Array.isArray(inp)) for(let i=1;i<inp.length;i++) if(typeof inp[i]==="string") stack.push(inp[i]);
    }
  }
  let dead=0;
  for(const id of Object.keys(blocks)){
    const b=blocks[id]; if(!b||b.shadow||b.topLevel) continue;
    if(!reach.has(id)){ delete blocks[id]; dead++; }
  }
  return dead;
}
function compileCacheGet(key){ return COMPILE_CACHE.get(key)||null; }
function compileCacheSet(key,val){
  if(COMPILE_CACHE.size>=COMPILE_CACHE_MAX){
    const first=COMPILE_CACHE.keys().next().value;
    COMPILE_CACHE.delete(first);
  }
  COMPILE_CACHE.set(key,val);
}

async function compileAllAsync(doOptimize, quiet){
  const t0=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  Object.keys(SCRIT_BROADCASTS).forEach(k=>delete SCRIT_BROADCASTS[k]);
  if(!quiet) clearDiag();
  else diagnostics.length=0;
  if(!quiet) traceReset();
  saveActive();
  const level=doOptimize?OPT_LEVEL:0;
  const names=fsList();
  const sprites=[], libs=[];
  for(const n of names){
    const src=fsGet(n);
    if(!/^properties\s*:/m.test(src)) libs.push(n); else sprites.push(n);
  }
  if(!quiet){
    trace("parse","compileAll start","optimize="+!!doOptimize+" level="+level+" sprites="+sprites.length);
    for(const n of sprites) await prefetchRemotesForSource(fsGet(n));
    for(const n of libs) await prefetchRemotesForSource(fsGet(n));
  }
  const results=[];
  const targets=(quiet&&FS.active&&sprites.includes(FS.active))? [FS.active] : sprites;
  for(const n of targets){
    let src=fsGet(n);
    const cacheKey=scritFastHash(n+"\0"+level+"\0"+src);
    const hit=compileCacheGet(cacheKey);
    if(hit){
      results.push(hit);
      if(!quiet){ out("Compile "+n+" (cache)","ok"); trace("parse","cache hit",n); }
      continue;
    }
    if(!quiet) out("Compile "+n+(level?(" -O"+level):""),"info");
    const {used}=linkTimeDCE_source(src, null);
    const c=new Compiler(n, src, {isLib:false, optLevel:level, usedFns:used});
    const r=c.compile();
    if(!r) continue;
    r.file=n;
    if(level>0){
      let sir=blocksToSIR(r.blocks);
      let opt;
      try{ opt=optimizeSIR(sir, r.blocks, level); }
      catch(e){
        if(!quiet){ trace("error","optimizer crash", String(e&&e.message||e)); emitErr("E032",1,String(e&&e.message||e)); }

function varySvg(svg, seed){
  const rnd = (()=>{ let s=seed|0; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; })();
  const bias = [Math.floor(rnd()*40)-20, Math.floor(rnd()*40)-20, Math.floor(rnd()*40)-20];
  return svg.replace(/#([0-9a-fA-F]{6})\b/g, (_,h)=>{
    let r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    r=Math.max(0,Math.min(255,r+bias[0])); g=Math.max(0,Math.min(255,g+bias[1])); b=Math.max(0,Math.min(255,b+bias[2]));
    return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
  }).replace(/#([0-9a-fA-F]{3})\b/g, (_,h)=>{
    const full=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    let r=parseInt(full.slice(0,2),16), g=parseInt(full.slice(2,4),16), b=parseInt(full.slice(4,6),16);
    r=Math.max(0,Math.min(255,r+bias[0])); g=Math.max(0,Math.min(255,g+bias[1])); b=Math.max(0,Math.min(255,b+bias[2]));
    return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
  });
}
function pickCostumeKey(props, index, used){
  const keys=Object.keys(SVG_ASSETS);
  let key = props && props.costume && SVG_ASSETS[props.costume] ? props.costume : null;
  if(!key || used.has(key)){
    
    const free=keys.filter(k=>!used.has(k));
    key = free.length ? free[index % free.length] : keys[index % keys.length];
  }
  used.add(key);

}
function md5svg(str){
  const data=new TextEncoder().encode(String(str));
  const bitLength=data.length*8;
  const blockCount=((data.length+8)>>6)+1;
  const bytes=new Uint8Array(blockCount*64);
  bytes.set(data);bytes[data.length]=0x80;
  const view=new DataView(bytes.buffer);
  view.setUint32(bytes.length-8,bitLength>>>0,true);
  view.setUint32(bytes.length-4,Math.floor(bitLength/0x100000000),true);
  const shifts=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  const constants=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*0x100000000)>>>0);
  let A=0x67452301,B=0xefcdab89,C=0x98badcfe,D=0x10325476;
  const rotate=(value,count)=>((value<<count)|(value>>>(32-count)))>>>0;
  for(let offset=0;offset<bytes.length;offset+=64){
    const words=Array.from({length:16},(_,i)=>view.getUint32(offset+i*4,true));
    let a=A,b=B,c=C,d=D;
    for(let i=0;i<64;i++){
      let f,g,shift;
      if(i<16){f=(b&c)|(~b&d);g=i;shift=shifts[i%4];}
      else if(i<32){f=(d&b)|(~d&c);g=(5*i+1)%16;shift=shifts[4+i%4];}
      else if(i<48){f=b^c^d;g=(3*i+5)%16;shift=shifts[8+i%4];}
      else{f=c^(b|~d);g=(7*i)%16;shift=shifts[12+i%4];}
      const sum=(a+f+constants[i]+words[g])>>>0;
      const next=(b+rotate(sum,shift))>>>0;
      a=d;d=c;c=b;b=next;
    }
    A=(A+a)>>>0;B=(B+b)>>>0;C=(C+c)>>>0;D=(D+d)>>>0;
  }
  return [A,B,C,D].map(word=>[word&255,(word>>>8)&255,(word>>>16)&255,(word>>>24)&255].map(byte=>byte.toString(16).padStart(2,"0")).join("")).join("");
}
function makeCostumeAsset(props, index, used){
  const key=pickCostumeKey(props, index, used);
  const base=SVG_ASSETS[key];
  const seed = (index+1)*9973 + (props&&props.name? props.name.length*13:0);
  const varied=varySvg(base.svg, seed);
  const assetId=md5svg(varied);

}



function normalizeScratchBlockGraph(blocks){
  if(!blocks||typeof blocks!=="object")return {blocks:0,brokenNext:0,brokenParents:0,danglingInputs:0};
  const ids=Object.keys(blocks),valid=new Set(ids);
  let brokenNext=0,brokenParents=0,danglingInputs=0;
  // Remove missing next links and break cycles without recursive traversal.
  for(const id of ids){
    const b=blocks[id];
    if(b.next&&!valid.has(b.next)){b.next=null;brokenNext++;}
  }
  const done=new Set();
  for(const root of ids){
    if(done.has(root))continue;
    const path=[],index=new Map();let id=root;
    while(id&&valid.has(id)&&!done.has(id)&&!index.has(id)){
      index.set(id,path.length);path.push(id);id=blocks[id].next;
    }
    if(id&&index.has(id)){
      const last=path[path.length-1];
      if(blocks[last].next){blocks[last].next=null;brokenNext++;}
    }
    for(const nodeId of path)done.add(nodeId);
  }
  // Strip dangling input references; preserve a valid shadow fallback where possible.
  for(const id of ids){
    const b=blocks[id];
    for(const [key,input] of Object.entries(b.inputs||{})){
      if(!Array.isArray(input))continue;
      if(typeof input[1]==="string"&&!valid.has(input[1])){
        if(typeof input[2]==="string"&&valid.has(input[2])){input[1]=input[2];input.length=2;}
        else{delete b.inputs[key];}
        danglingInputs++;
      }else if(input.length>2&&typeof input[2]==="string"&&!valid.has(input[2])){input.length=2;danglingInputs++;}
    }
    if(b.parent&&!valid.has(b.parent)){b.parent=null;brokenParents++;}
  }
  // Parent pointers must be acyclic. Break malformed links defensively.
  for(const id of ids){
    let cur=id,prev=null,seen=new Set(),guard=0;
    while(cur&&valid.has(cur)&&guard++<=ids.length){
      if(seen.has(cur)){
        if(prev&&blocks[prev])blocks[prev].parent=null;
        else if(blocks[id])blocks[id].parent=null;
        brokenParents++;break;
      }
      seen.add(cur);prev=cur;cur=blocks[cur].parent;
    }
    if(guard>ids.length&&blocks[id]&&blocks[id].parent){blocks[id].parent=null;brokenParents++;}
  }
  return {blocks:ids.length,brokenNext,brokenParents,danglingInputs};
}

          decos.push({
            range:new monaco.Range(li+1,start,li+1,end),
            options:{inlineClassName:cls, stickiness:monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges}
          });
        }
        // members after dot
        const reMem=/\.([A-Za-z_]\w*)/g; let mm;
        while((mm=reMem.exec(stripped))){
          const start=mm.index+2;
          const end=start+mm[1].length;
          decos.push({
            range:new monaco.Range(li+1,start,li+1,end),
            options:{inlineClassName:"scrit-sem-member", stickiness:monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges}
          });
        }
      }
      if(ed.__scritSemDecos) ed.__scritSemDecos=ed.deltaDecorations(ed.__scritSemDecos, decos);
      else ed.__scritSemDecos=ed.deltaDecorations([], decos);
    }

    monaco.languages.registerCompletionItemProvider("scrit",{
      triggerCharacters:[".","@","\""],
      provideCompletionItems(model,pos){
        const until=model.getValueInRange({startLineNumber:1,startColumn:1,endLineNumber:pos.lineNumber,endColumn:pos.column});
        const w=model.getWordUntilPosition(pos);
        const range={startLineNumber:pos.lineNumber,endLineNumber:pos.lineNumber,startColumn:w.startColumn,endColumn:w.endColumn};
        const sugs=[];
        if(/@import\s*$/.test(until)||/@import\s+\w*$/.test(until)){
          Object.keys(LIBS).forEach(l=>sugs.push({label:l,kind:monaco.languages.CompletionItemKind.Module,insertText:l+" as "+(l==="sensing"?"sense":l==="motion"?"move":l==="looks"?"look":l),range}));
          fsList().forEach(f=>sugs.push({label:f,kind:monaco.languages.CompletionItemKind.File,insertText:'"'+f+'" as '+f.replace(".scrit",""),range}));
        }
        if(/@local\s*$/.test(until)||/@cloud\s*$/.test(until)){ sugs.push({label:"name: number = 0",kind:monaco.languages.CompletionItemKind.Snippet,insertText:"${1:name}: number = ${2:0}",insertTextRules:monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,range}); }
        const m=until.match(/(\w+)\.\s*$/);
        if(m){
          const im={}; const re=/@import\s+(\w+)\s+as\s+(\w+)/g; let mm; while((mm=re.exec(model.getValue()))) im[mm[2]]=mm[1];
          const lib=im[m[1]]||(LIBS[m[1]]?m[1]:null);
          if(lib&&LIBS[lib]){
            Object.keys(allMethods(lib)).forEach(fn=>{ const meta=allMethods(lib)[fn]; const args=(meta.a||[]).map((a,i)=>"${"+(i+1)+":"+a+"}").join(", ");
              sugs.push({label:fn,kind:monaco.languages.CompletionItemKind.Method,insertText:fn+(meta.a&&meta.a.length?"("+args+")":"()"),insertTextRules:monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,range}); });
            Object.keys(LIBS[lib].reporters||{}).forEach(fn=>sugs.push({label:fn,kind:monaco.languages.CompletionItemKind.Property,insertText:fn,detail:"reporter",range}));
          }
        }
        return {suggestions:sugs};
      }
    });
    window.__scritEditor=monaco.editor.create(document.getElementById("editor"),{
      value:FS.files[FS.active],
      language:"scrit",
      theme:"scrit-dark",
      fontSize:14,
      fontFamily:"'JetBrains Mono','Fira Code',Consolas,ui-monospace,monospace",
      fontLigatures:true,
      lineHeight:22,
      minimap:{enabled:true,renderCharacters:false,maxColumn:80},
      automaticLayout:true,
      tabSize:2,
      insertSpaces:true,
      cursorBlinking:"smooth",
      cursorSmoothCaretAnimation:"on",
      cursorWidth:2,
      smoothScrolling:true,
      bracketPairColorization:{enabled:true},
      guides:{indentation:true,bracketPairs:true},
      renderLineHighlight:"all",
      matchBrackets:"always",
      padding:{top:8,bottom:8},
      scrollbar:{verticalScrollbarSize:10,horizontalScrollbarSize:10}
    });
    editor=window.__scritEditor;
    editor.onDidChangeCursorPosition(e=>{ document.getElementById("cursor").textContent=`Ln ${e.position.lineNumber}, Col ${e.position.column}`; });
    let semTimer=null;
    editor.onDidChangeModelContent(()=>{ saveActive(); clearTimeout(semTimer); semTimer=setTimeout(()=>{ try{ applyScritSemantics(editor); }catch(_){} }, 200); clearTimeout(liveTimer); liveTimer=setTimeout(()=>compileAll(),280); });
    setTimeout(()=>applyScritSemantics(editor),0);
    renderFiles(); renderTabs();
    
    const fl=document.getElementById("fileList");
    if(fl && !fl._ctxBound){
      fl._ctxBound=true;
      fl.addEventListener("contextmenu", e=>{
        const f=e.target.closest("[data-f]"); if(!f) return;
        e.preventDefault(); e.stopPropagation();
        const menu=document.getElementById("ctxMenu");
        if(!menu) return;
        menu.style.display="block";
        menu.style.left=Math.min(e.clientX,innerWidth-160)+"px";
        menu.style.top=Math.min(e.clientY,innerHeight-80)+"px";
        menu.dataset.file=f.dataset.f;
      }, true);
    }
  }
  function startFallback(){
    if(window.__scritEditor)return;
    const host=document.getElementById("editor");host.innerHTML="";
    const area=document.createElement("textarea");
    area.spellcheck=false;area.value=FS.files[FS.active]||"";
    area.style.cssText="position:absolute;inset:0;width:100%;height:100%;resize:none;box-sizing:border-box;border:0;outline:0;background:#1e1e1e;color:#d4d4d4;padding:16px;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto";
    host.appendChild(area);
    const listeners=[];
    editor={
      getValue:()=>area.value,
      setValue:value=>{area.value=String(value??"");},
      getModel:()=>null,
      onDidChangeModelContent:fn=>{listeners.push(fn);area.addEventListener("input",fn);},
      onDidChangeCursorPosition:fn=>{area.addEventListener("keyup",()=>{const before=area.value.slice(0,area.selectionStart),lines=before.split("\n");fn({position:{lineNumber:lines.length,column:lines[lines.length-1].length+1}});});},
      revealLineInCenter:line=>{const lines=area.value.split("\n"),target=Math.max(1,Math.min(lines.length,Number(line)||1));let offset=0;for(let i=0;i<target-1;i++)offset+=lines[i].length+1;area.focus();area.setSelectionRange(offset,offset+lines[target-1].length);},
      focus:()=>area.focus()
    };
    window.__scritEditor=editor;
    area.addEventListener("input",()=>{saveActive();clearTimeout(liveTimer);liveTimer=setTimeout(()=>compileAll(),280);});
    area.addEventListener("keyup",()=>{const before=area.value.slice(0,area.selectionStart),lines=before.split("\n");document.getElementById("cursor").textContent=`Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`;});
    renderFiles();renderTabs();
    out("Monaco no disponible; editor de texto de reserva activo","warn");
  }
  if(window.monaco)start();
  else{
    const script=document.createElement("script");
    script.src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js";
    script.onload=()=>{try{require.config({paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"}});require(["vs/editor/editor.main"],start,startFallback);}catch(error){startFallback();}};
    script.onerror=startFallback;
    document.head.appendChild(script);
  }
})();
</script>
</body>
</html>
