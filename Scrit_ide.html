<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scrit IDE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#1e1e1e;--side:#252526;--border:#3c3c3c;--accent:#007acc;--text:#d4d4d4;--muted:#858585;--err:#f14c4c;--warn:#cca700;--ok:#4ec9b0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:40px 1fr 24px;height:100vh}
#main{display:grid;grid-template-columns:240px 1fr 300px;min-height:0}
#main.no-right{grid-template-columns:240px 1fr 0}
#main.no-left{grid-template-columns:0 1fr 300px}
#editor-wrap{position:relative;min-height:0}#editor{position:absolute;inset:0}
.tab{padding:6px 12px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:var(--accent);background:#2d2d2d}
.tab.dirty::after{content:"•";margin-left:4px;color:#e5c07b}
.file{padding:5px 10px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center;border-radius:4px}
.file:hover{background:#2a2d2e}.file.active{background:#37373d;color:#fff}
.file .icon{width:14px;opacity:.7}
.problem{padding:8px 10px;font-size:12px;border-left:3px solid transparent;cursor:pointer;border-bottom:1px solid #2a2a2a}
.problem:hover{background:#2a2d2e}
.problem.error{border-left-color:var(--err)}.problem.warn{border-left-color:var(--warn)}.problem.info{border-left-color:#3794ff}
.problem .code{font-family:ui-monospace,monospace;color:#9cdcfe;font-size:10px}
.problem .hint{color:var(--muted);font-size:11px;margin-top:2px}
.chip{background:#2d2d2d;border-radius:5px;padding:4px 8px;margin:2px 0;border-left:3px solid #4c97ff;font-size:11px;font-family:monospace}
.ptr-card{background:#1e1e1e;border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;font-size:11px;font-family:ui-monospace,monospace}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.tag-live{background:#0e3d32;color:#4ec9b0}.tag-freed{background:#3d1212;color:#f14c4c}
.tag-local{background:#1a2a4a;color:#6cb6ff}.tag-cloud{background:#3d2a10;color:#e5c07b}.tag-lib{background:#2a1a3d;color:#c678dd}
.scrit-sem-alias{color:#FBBF24!important;font-weight:700}
.scrit-sem-var{color:#93C5FD!important}
.scrit-sem-fn{color:#4ADE80!important;font-weight:700}
.scrit-sem-lib{color:#F59E0B!important;font-weight:700}
.scrit-sem-member{color:#2DD4BF!important}

.btn{padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;border:none;color:#fff}
.btn-primary{background:var(--accent)}.btn-sec{background:#0e639c}.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#424242;border-radius:4px}

#ctxMenu{position:fixed;z-index:9999;background:#2d2d2d;border:1px solid #3c3c3c;border-radius:6px;min-width:140px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#ctxMenu button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:none;color:#ccc;font-size:12px;cursor:pointer}
#ctxMenu button:hover{background:#094771;color:#fff}
</style>
</head>
<body>
<div id="ctxMenu"><button type="button" data-act="delete">Eliminar archivo</button><button type="button" data-act="rename">Renombrar</button></div>
<div id="app">
<header class="flex items-center justify-between px-3" style="background:#323233;border-bottom:1px solid var(--border)">
  <div class="flex items-center gap-2">
    <button class="btn btn-ghost" id="btnLeft" title="Toggle explorer">☰</button>
    <span class="text-sm font-semibold text-white">Scrit</span>
    <span class="text-[10px]" style="color:var(--muted)">multi-file · types · cloud · sb3</span>
  </div>
  <div class="flex gap-2">
    <button class="btn btn-ghost" id="btnNewFile">+ File</button>
    <button class="btn btn-primary" id="btnCompile">Compile</button>
    <button class="btn btn-sec" id="btnExport">Export</button>
  </div>
</header>
<div id="main">
  <aside id="sidebar" style="background:var(--side);border-right:1px solid var(--border)" class="flex flex-col min-h-0 overflow-hidden">
    <div class="px-3 py-2 text-[10px] font-semibold uppercase" style="color:var(--muted);border-bottom:1px solid var(--border)">Explorer</div>
    <div id="fileList" class="flex-1 overflow-y-auto p-2 space-y-0.5"></div>
    <div class="p-2 text-[10px]" style="color:var(--muted);border-top:1px solid var(--border)">
      1 sprite → .sprite3 · 2+ → .sb3<br/>
      @import "lib.scrit" as x<br/>
      @import "https://…/f.scrit" as y<br/>
      $x = 4 · include · optimize -On
    </div>
  </aside>
  <section class="flex flex-col min-h-0" style="background:var(--bg)">
    <div id="tabs" class="flex overflow-x-auto" style="background:#2d2d2d;border-bottom:1px solid var(--border)"></div>
    <div id="editor-wrap" class="flex-1"><div id="editor"></div></div>
    <div style="border-top:1px solid var(--border);background:var(--side)">
      <div class="flex" style="border-bottom:1px solid var(--border)">
        <div class="tab active" data-p="problems">Problems <span id="probN" class="text-[10px] px-1.5 rounded-full" style="background:#3c3c3c">0</span></div>
        <div class="tab" data-p="output">Console</div>
        <div class="tab" data-p="blocks">Blocks</div>
      </div>
      <div id="panel-problems" class="h-36 overflow-y-auto"></div>
      <div id="panel-output" class="h-36 overflow-hidden hidden flex flex-col font-mono text-xs">
        <div id="consoleLog" class="flex-1 overflow-y-auto p-2 space-y-0.5"></div>
        <div class="flex items-center gap-1 px-2 py-1 border-t" style="border-color:var(--border);background:#1a1a1a">
          <span style="color:var(--accent)">›</span>
          <input id="consoleInput" type="text" autocomplete="off" spellcheck="false" placeholder="help | optimize -O3 | optimize -Bandit | compile | export | ls" class="flex-1 bg-transparent outline-none text-xs" style="color:var(--text);font-family:ui-monospace,monospace"/>
        </div>
      </div>
      <div id="panel-blocks" class="h-36 overflow-y-auto hidden p-2"></div>
    </div>
  </section>
  <aside style="background:var(--side);border-left:1px solid var(--border)" class="flex flex-col min-h-0">
    <div class="flex" style="border-bottom:1px solid var(--border)">
      <div class="tab active px-3 py-2 text-[10px] font-semibold uppercase cursor-pointer" data-tr="mem" style="color:var(--muted)">Memoria</div>
      <div class="tab px-3 py-2 text-[10px] font-semibold uppercase cursor-pointer" data-tr="cmp" style="color:var(--muted)">Compilador</div>
    </div>
    <div id="trackerMem" class="flex-1 overflow-y-auto p-3"></div>
    <div id="trackerCmp" class="flex-1 overflow-y-auto p-2 font-mono text-[10px] hidden" style="line-height:1.45"></div>
    <div class="p-3 text-[11px]" style="border-top:1px solid var(--border)"><pre id="rtSummary" class="font-mono p-2 rounded" style="background:#1e1e1e;border:1px solid var(--border)">—</pre></div>
  </aside>
</div>
<footer class="flex items-center justify-between px-3 text-[11px] text-white" style="background:var(--accent)">
  <span id="status">Ready</span><span id="cursor">Ln 1, Col 1</span>
</footer>
</div>

function fmtErr(code, ...args){
  const e = ERR[code] || {sev:"error", msg:code, hint:""};
  let m = e.msg;
  args.forEach((a,i)=>{ m = m.replace("{"+i+"}", String(a)); });
  return {code, sev:e.sev, msg:m, hint:e.hint};
}

const BANDIT_ARMS={
  dce:{n:1,r:1}, egraph:{n:1,r:1}, smt:{n:1,r:1}, strength:{n:1,r:1}, gvn:{n:1,r:1},
  pulse:{n:1,r:1}, linear:{n:1,r:1}, loops:{n:1,r:1}, inline:{n:1,r:1}, mem:{n:1,r:1},
  unroll:{n:1,r:1}, empty:{n:1,r:1}, sat2:{n:1,r:1}
};
function banditSelect(available, k){
  const arms=available.filter(a=>BANDIT_ARMS[a]);
  const total=arms.reduce((s,a)=>s+(BANDIT_ARMS[a].n||1),0);
  const scored=arms.map(a=>{
    const st=BANDIT_ARMS[a];
    const avg=st.r/Math.max(1,st.n);
    const ucb=avg+Math.sqrt(2*Math.log(total+1)/Math.max(1,st.n));
    return {a,ucb,avg};
  }).sort((x,y)=>y.ucb-x.ucb);
  return scored.slice(0,k).map(x=>x.a);
}
function banditUpdate(arm, reward){
  const st=BANDIT_ARMS[arm]; if(!st) return;
  st.n+=1; st.r+=Math.max(0,reward);
}
function banditReport(){
  return Object.entries(BANDIT_ARMS).map(([k,v])=>k+":n="+v.n+" r="+v.r.toFixed(2)+" avg="+(v.r/Math.max(1,v.n)).toFixed(3)).join(" | ");
}

function out(msg,kind="info"){
  const el=document.getElementById("consoleLog")||document.getElementById("panel-output");
  if(!el) return;
  const d=document.createElement("div");
  d.className=kind==="ok"?"text-[#4ec9b0]":kind==="err"?"text-[#f14c4c]":kind==="warn"?"text-[#cca700]":"text-[#abb2bf]";
  d.textContent=msg;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
}
function consPrint(msg,kind="info"){ out(msg,kind); }

async function fetchRemoteScrit(url){
  const key=String(url).trim();
  if(REMOTE_CACHE.has(key)) return REMOTE_CACHE.get(key);
  out("fetch "+key+" …","info");
  try{
    const res=await fetch(key,{mode:"cors"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text=await res.text();
    REMOTE_CACHE.set(key,text);
    out("fetched "+key+" ("+text.length+" bytes)","ok");
    return text;
  }catch(e){
    out("fetch failed: "+(e&&e.message||e),"err");
    return null;
  }
}

async function runConsoleCommand(raw){
  const line=String(raw||"").trim();
  if(!line) return;
  CONSOLE_HISTORY.push(line);
  CONSOLE_HIST_IDX=CONSOLE_HISTORY.length;
  out("› "+line,"info");
  const parts=line.match(/(?:[^\s"]+|"[^"]*")+/g)||[];
  const cmd=(parts[0]||"").toLowerCase();
  const arg=i=>{ const a=parts[i]; if(!a) return ""; return a.startsWith('"')&&a.endsWith('"')?a.slice(1,-1):a; };

  try{
    if(cmd==="help"||cmd==="?"){
      out("Comandos FS / build:","ok");
      out("  ls | dir                 listar archivos del proyecto");
      out("  cat <file>               mostrar contenido");
      out("  rm <file>                eliminar archivo");
      out("  new <file> [lib]         crear archivo (lib = sin properties)");
      out("  include \"url\"            descargar .scrit y añadirlo al FS como lib");
      out("  open <file>              activar pestaña");
      out("  compile                  compilar (DCE básico, sin -O)");
      out("  export                   exportar .sprite3 / .sb3");
      out("  optimize -O1|-O2|-O3     SSA+E-graph+SMT+pulsos+loops");
      out("  optimize -Bandit         bandit UCB1 elige pases (inline/GVN/mem)");
      out("  bandit                   estado del multi-armed bandit");
      out("  optlevel                 ver nivel actual");
      out("  clear | cls              limpiar consola");
      out("  cache                    ver caché de @import remotos");
      out("Sintaxis: $x = 4  → runtime: escribe en la variable cuyo nombre está en x");
      out("  y = $x         → runtime: lee del mapa / write-through");
      out("@import \"https://…/f.scrit\" as y  → solo en compile-time (no al FS)");
      return;
    }
    if(cmd==="clear"||cmd==="cls"){ const el=document.getElementById("consoleLog"); if(el) el.innerHTML=""; return; }
    if(cmd==="ls"||cmd==="dir"){
      const names=fsList();
      if(!names.length){ out("(vacío)","warn"); return; }
      names.forEach(n=>{
        const lib=!/^properties\s*:/m.test(fsGet(n));
        out((lib?"📦 ":"📄 ")+n+(lib?"  [lib]":""));
      });
      return;
    }
    if(cmd==="cat"){
      const f=arg(1); if(!f){ out("uso: cat <file>","err"); return; }
      const name=f.endsWith(".scrit")?f:f+".scrit";
      if(!FS.files[name] && !FS.files[f]){ out("no existe: "+f,"err"); return; }
      out((FS.files[name]||FS.files[f]).slice(0,8000));
      return;
    }
    if(cmd==="rm"||cmd==="del"){
      const f=arg(1); if(!f){ out("uso: rm <file>","err"); return; }
      const name=FS.files[f]?f:(f.endsWith(".scrit")?f:f+".scrit");
      if(!FS.files[name]){ out("no existe: "+f,"err"); return; }
      if(fsList().length<=1){ out("debe quedar al menos un archivo","err"); return; }
      fsDelete(name); out("eliminado "+name,"ok"); return;
    }
    if(cmd==="new"){
      const f=arg(1); if(!f){ out("uso: new <file> [lib]","err"); return; }
      const isLib=String(arg(2)).toLowerCase()==="lib";
      fsNew(f, isLib?DEFAULT_LIB:DEFAULT_MAIN.replace("Main",f.replace(/\.scrit$/,"")));
      out("creado "+(f.endsWith(".scrit")?f:f+".scrit")+(isLib?" (lib)":""),"ok");
      return;
    }
    if(cmd==="open"){
      const f=arg(1); if(!f){ out("uso: open <file>","err"); return; }
      const name=FS.files[f]?f:(f.endsWith(".scrit")?f:f+".scrit");
      if(!FS.files[name]){ out("no existe","err"); return; }
      saveActive(); FS.active=name; loadActive(); out("activo: "+name,"ok"); return;
    }
    if(cmd==="include"){
      const url=arg(1); if(!url){ out('uso: include "https://…/file.scrit"',"err"); return; }
      const text=await fetchRemoteScrit(url);
      if(text==null) return;
      let base=url.split("/").pop()||"remote.scrit";
      if(!base.endsWith(".scrit")) base+=".scrit";
      // strip properties if present (libs must not have them)
      let body=text;
      if(/^properties\s*:/m.test(body)){
        body=body.replace(/^properties\s*:[\s\S]*?(?=^\S|\Z)/m,"# [include] properties stripped\n");
        out("properties eliminadas (es lib)","warn");
      }
      if(FS.files[base]) base=base.replace(/\.scrit$/,"_"+Date.now()+".scrit");
      FS.files[base]=body;
      renderFiles(); renderTabs();
      out("incluido en FS como "+base,"ok");
      return;
    }
    if(cmd==="compile"){
      const r=await compileAllAsync(OPT_LEVEL>0,false);
      out(r&&r.length?"compile OK ("+r.length+" sprite(s))":"compile con errores",r&&r.length?"ok":"err");
      return;
    }
    if(cmd==="export"){
      await exportProject();
      return;
    }
    if(cmd==="optimize"||cmd==="opt"){
      let level=2;
      OPT_BANDIT=false;
      const flags=parts.slice(1).map(p=>p.replace(/^"|"$/g,""));
      for(const flag of flags){
        const m=String(flag).match(/-?O([0123])/i);
        if(m) level=+m[1];
        else if(/^[0123]$/.test(flag)) level=+flag;
        else if(/^-?bandit$/i.test(flag)) { OPT_BANDIT=true; level=3; }
      }
      if(!flags.length) level=2;
      OPT_LEVEL=level;
      out("optimize -O"+level+(OPT_BANDIT?" -Bandit":"")+" (inline+GVN+mem+SSA+egraph+pulses+loops)","info");
      const r=await compileAllAsync(true,false);
      if(r&&r.length) out("optimize OK · O"+level+(OPT_BANDIT?" bandit":""),"ok");
      else out("optimize falló","err");
      if(OPT_BANDIT) out("bandit "+banditReport(),"info");
      return;
    }
    if(cmd==="bandit"){
      out(banditReport(),"ok");
      return;
    }
    if(cmd==="optlevel"){
      out("OPT_LEVEL="+OPT_LEVEL+" BANDIT="+OPT_BANDIT+" (0 = Compile, solo DCE)","info");
      return;
    }
    if(cmd==="cache"){
      if(!REMOTE_CACHE.size){ out("(caché vacía)","warn"); return; }
      for(const [k,v] of REMOTE_CACHE) out(k+"  "+v.length+"b");
      return;
    }
    out("comando desconocido: "+cmd+"  (help)","err");
  }catch(e){
    out("error: "+(e&&e.message||e),"err");
  }
}

function bindConsole(){
  const inp=document.getElementById("consoleInput");
  if(!inp||inp._bound) return;
  inp._bound=true;
  inp.addEventListener("keydown", async e=>{
    if(e.key==="Enter"){
      const v=inp.value; inp.value="";
      await runConsoleCommand(v);
    } else if(e.key==="ArrowUp"){
      e.preventDefault();
      if(CONSOLE_HIST_IDX>0){ CONSOLE_HIST_IDX--; inp.value=CONSOLE_HISTORY[CONSOLE_HIST_IDX]||""; }
    } else if(e.key==="ArrowDown"){
      e.preventDefault();
      if(CONSOLE_HIST_IDX<CONSOLE_HISTORY.length-1){ CONSOLE_HIST_IDX++; inp.value=CONSOLE_HISTORY[CONSOLE_HIST_IDX]||""; }
      else { CONSOLE_HIST_IDX=CONSOLE_HISTORY.length; inp.value=""; }
    }
  });
}
function diag(sev,code,msg,opts={}){
  diagnostics.push({sev,code,msg,hint:opts.hint||"",line:opts.line||0,file:opts.file||FS.active});
  renderProblems();
}
function emitErr(code, line, ...args){
  const e=fmtErr(code,...args);
  diag(e.sev, code, e.msg, {hint:e.hint, line, file:FS.active});
}
function clearDiag(){ diagnostics.length=0; renderProblems(); if(editor&&window.monaco) monaco.editor.setModelMarkers(editor.getModel(),"scrit",[]); }
function renderProblems(){
  const p=document.getElementById("panel-problems"); p.innerHTML="";
  document.getElementById("probN").textContent=diagnostics.length;
  const mks=[];
  diagnostics.forEach(d=>{
    const div=document.createElement("div"); div.className=`problem ${d.sev}`;
    div.innerHTML=`<div class="flex gap-2"><span class="text-[#858585] w-10">L${d.line||"?"}</span><div><div><span class="code">[${d.code}]</span> ${d.msg}</div>${d.hint?`<div class="hint">${d.hint}</div>`:""}<div class="hint">${d.file||""}</div></div></div>`;
    div.onclick=()=>{ if(d.file&&d.file!==FS.active){ saveActive(); FS.active=d.file; loadActive(); } if(d.line&&editor) editor.revealLineInCenter(d.line); };
    p.appendChild(div);
    if(d.line&&window.monaco&&(!d.file||d.file===FS.active)) mks.push({severity:d.sev==="error"?monaco.MarkerSeverity.Error:d.sev==="warn"?monaco.MarkerSeverity.Warning:monaco.MarkerSeverity.Info,message:`[${d.code}] ${d.msg}`,startLineNumber:d.line,startColumn:1,endLineNumber:d.line,endColumn:200});
  });
  if(editor&&window.monaco) monaco.editor.setModelMarkers(editor.getModel(),"scrit",mks);
}

    const isLib = !/^properties\s*:/m.test(fsGet(n));

      <span class="icon">${isLib?"📦":"📄"}</span><span class="flex-1 truncate">${n}</span>

  }).join("");

    const f=e.target.closest("[data-f]"); if(!f) return;

        menu.dataset.file=f.dataset.f;

    }
  };

    const menu=document.getElementById("ctxMenu");

function findAssignEq(line){
  let inStr=null;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inStr){ if(c==="\\"){i++;continue;} if(c===inStr) inStr=null; continue; }
    if(c==='"'||c==="'"){ inStr=c; continue; }
    if(c==='='){ const p=line[i-1],n=line[i+1]; if(p==='='||p==='!'||p==='<'||p==='>') continue; if(n==='=') continue; return i; }
  }
  return -1;
}

}


class PointerTracker {
  constructor(){
    this.ptrs=new Map();

  }
  len(){ return this.slots.length-1; }
  isFree(i){ const v=this.slots[i]; return v===undefined || v===" " || v===null; }
  alloc(name,n,line){
    n=Math.max(1, Math.floor(+n||1));
    let start=-1;
    
    for(let i=1;i<=this.len();i++){
      let ok=true;
      for(let j=0;j<n;j++){
        const idx=i+j;
        if(idx<=this.len() && !this.isFree(idx)){ ok=false; break; }
      }
      if(ok){ start=i; break; }
    }
    if(start<0) start=this.len()+1;
    while(this.slots.length <= start+n-1) this.slots.push(" ");
    for(let j=0;j<n;j++) this.slots[start+j]=0;
    const end=start+n-1;
    const st={state:"live",start,end,cur:start,allocLine:line,freeLine:null,size:n,history:[`alloc(${n})@[${start}..${end}]@L${line}`]};
    this.ptrs.set(name,st);
    return st;
  }
  freeSlots(st){
    for(let i=st.start;i<=st.end;i++) this.slots[i]=" ";
  }
  requireLive(name,line,op){
    const st=this.ptrs.get(name);
    if(!st){ emitErr("E008",line,name); return null; }
    if(st.state==="freed"){ emitErr("E006",line,name); return null; }
    return st;
  }
  write(n,l){ const s=this.requireLive(n,l,"write"); if(s){ s.history.push("write@L"+l); this.slots[s.cur]=1; } return !!s; }
  read(n,l){ const s=this.requireLive(n,l,"read"); if(s) s.history.push("read@L"+l); return !!s; }
  move(n,off,l){
    const s=this.requireLive(n,l,"move"); if(!s) return false;
    off=Math.floor(+off);
    if(off<s.start||off>s.end){ emitErr("E009",l,n,off,s.start,s.end); return false; }
    s.cur=off; s.history.push("move("+off+")"); return true;
  }
  step(n,l){
    const s=this.requireLive(n,l,"step"); if(!s) return false;
    if(s.cur>=s.end){ emitErr("E009",l,n,s.cur+1,s.start,s.end); return false; }
    s.cur++; s.history.push("step"); return true;
  }
  free(n,l){
    const s=this.ptrs.get(n);
    if(!s){ emitErr("E008",l,n); return false; }
    if(s.state==="freed"){ emitErr("E007",l,n); return false; }
    this.freeSlots(s);
    s.state="freed"; s.freeLine=l; s.history.push("free→holes@L"+l); return true;
  }
  freeHeap(l){
    for(const [,s] of this.ptrs) if(s.state==="live"){ this.freeSlots(s); s.state="freed"; s.freeLine=l; }
    for(let i=1;i<this.slots.length;i++) this.slots[i]=" ";
  }
  finish(){ for(const [n,s] of this.ptrs) if(s.state==="live") emitErr("E010",s.allocLine,n); }
}

function sourceHasRuntimeDollarRead(source){
  const lines=String(source||"").replace(/\r\n?/g,"\n").split("\n");
  for(const raw of lines){
    let clean="",quote=null,escape=false;
    for(let i=0;i<raw.length;i++){
      const ch=raw[i];
      if(quote){
        if(escape){escape=false;continue;}
        if(ch==="\\"){escape=true;continue;}
        if(ch===quote)quote=null;
        continue;
      }
      if(ch==="\""||ch==="'"){quote=ch;continue;}
      if(ch==="#")break;
      clean+=ch;
    }
    const lhs=clean.match(/^\s*\$[A-Za-z_]\w*\s*=(?!=)/);
    const inspected=lhs?clean.slice(lhs[0].length):clean;
    if(/\$[A-Za-z_]\w*/.test(inspected))return true;
  }
  return false;
}

      const indent=raw.match(/^\s*/)[0].length;

      const normalized=raw.slice(Math.min(indent,bodyIndent));
      const ret=trim.match(/^return\s+(.+)$/);

    const indent=(line.match(/^\s*/)||[""])[0].length;
    if(indent<=baseIndent) break;

  for(const line of body){

// Convert function-body statements into guarded Scratch-compatible control flow.
// Scratch custom procedures have no native return instruction: each `return` stores
// its value and raises a per-invocation done flag. Every following statement is guarded.
// The transform is indentation-aware and keeps if/else pairs intact.
function guardFunctionReturns(body, sourceLineMap, doneVar){

  const indentOf=text=>{const m=String(text).match(/^\s*/);return m?m[0].length:0;};

  const isHeader=t=>/^(?:if\s+.+|while\s+.+|repeat(?:\s+until\s+.+|\s+.+)?|for\s+.+|forever)\s*:$/.test(t);
  const findNextContent=i=>{while(i<records.length&&isBlank(records[i]))i++;return i;};
  function parseSeq(start, inputIndent, outputIndent){
    const out=[]; let i=start;
    while(i<records.length){
      const rec=records[i],raw=rec.text,trim=raw.trim(),d=indentOf(raw);
      if(d<inputIndent)break;
      if(isBlank(rec)){
        out.push({text:trim?" ".repeat(outputIndent)+trim:"",line:rec.line});i++;continue;

      if(d>inputIndent)break;

      if(trim==="else:"||/^elif\s+.+:$/.test(trim))break;
      const wrapper=" ".repeat(outputIndent)+`if ${doneVar} == 0:`;
      out.push({text:wrapper,line:rec.line});
      const headerIndent=outputIndent+2;
      out.push({text:" ".repeat(headerIndent)+trim,line:rec.line});
      i++;
      if(isHeader(trim)){
        let child=findNextContent(i);
        if(child<records.length&&indentOf(records[child].text)>d){
          const childIndent=indentOf(records[child].text);
          const parsed=parseSeq(child,childIndent,headerIndent+2);
          out.push(...parsed.out);i=parsed.next;
        }
        // Preserve Scratch's paired if/else structure under the same guard.
        if(/^if\s+.+:$/.test(trim)){
          const candidate=findNextContent(i);
          if(candidate<records.length&&indentOf(records[candidate].text)===d&&records[candidate].text.trim()==="else:"){
            const elseRec=records[candidate];
            out.push({text:" ".repeat(headerIndent)+"else:",line:elseRec.line});
            let elseStart=findNextContent(candidate+1);
            if(elseStart<records.length&&indentOf(records[elseStart].text)>d){

  for(let i=parsed.next;i<records.length;i++){
    const r=records[i]; parsed.out.push({text:r.text.trim()?r.text:"",line:r.line});
  }
  return {body:parsed.out.map(r=>r.text),lineMap:parsed.out.map(r=>r.line)};
}

    if(!match) continue;
    const baseIndent=match[1].length;

PointerTracker.prototype.alloc=function(name,n,line){
  n=Number(n);
  if(!Number.isInteger(n)||n<1||n>10000){emitErr("E009",line,name,n,1,10000);return null;}
  const previous=this.ptrs.get(name);
  if(previous&&previous.state==="live"){emitErr("E018",line,name);return previous;}
  let start=-1;
  for(let candidate=1;candidate<=this.len()+1;candidate++){
    let available=true;
    for(let offset=0;offset<n;offset++){
      const index=candidate+offset;
      if(index<=this.len()&&!this.isFree(index)){available=false;break;}
    }
    if(available){start=candidate;break;}
  }
  while(this.slots.length<start+n)this.slots.push(" ");
  for(let offset=0;offset<n;offset++)this.slots[start+offset]=0;
  const end=start+n-1,state={state:"live",start,end,cur:start,allocLine:line,freeLine:null,size:n,history:[`alloc(${n})@[${start}..${end}]@L${line}`]};
  this.ptrs.set(name,state);return state;
};

const SCRIT_EMIT_BEFORE_FINAL=Compiler.prototype.emitLibCall;
Compiler.prototype.emitLibCall=function(alias,method,argsTokens,parent,prev,lineNo){
  const lib=this.imports[alias],parts=splitExpressionArgs(argsTokens);
  if(lib==="ptr"){
    const pointerName=(parts[0]||[]).map(t=>t.v).join("").trim();
    if(method==="free")return this.emitFree(pointerName,parent,prev,lineNo).last;
    if(method==="free_heap"){

    if(method==="write")return this.emitDerefWrite(pointerName,this.compileExpr(parts[1]||[],lineNo),parent,prev,lineNo);
    if(method==="step")return this.emitStep(pointerName,parent,prev,lineNo,parts[1]?Number(parts[1].map(t=>t.v).join("")):1);
    if(method==="move")return this.emitMove(pointerName,Number(parts[1]?.map(t=>t.v).join("")??parts[0]?.map(t=>t.v).join("")),parent,prev,lineNo);
    if(method==="allocator"||method==="null"||method==="peek"||method==="sizeof"||method==="is_null"){

    }
  }
  if(lib==="stack"){
    const listId=this.ensureList("stack_data");
    if(method==="push")return this.emit("data_addtolist",{parent,prev,fields:{LIST:["stack_data",listId]},inputs:{ITEM:this.compileExpr(parts[0]||[],lineNo)}});
    if(method==="pop")return this.emit("data_deleteoflist",{parent,prev,fields:{LIST:["stack_data",listId]},inputs:{INDEX:this.textIn("last")}});
    if(method==="clear")return this.emit("data_deletealloflist",{parent,prev,fields:{LIST:["stack_data",listId]}});
    if(method==="dup")return this.emit("data_addtolist",{parent,prev,fields:{LIST:["stack_data",listId]},inputs:{ITEM:this.itemOfList(this.textIn("last"),"stack_data")}});
    if(method==="swap"){

      const idxA=scritMakeReporter(this,"operator_subtract",{NUM1:this.lengthOfList("stack_data"),NUM2:this.numIn(1)});
      const valueA=this.itemOfList(idxA,"stack_data");
      current=this.emit("data_replaceitemoflist",{parent,prev:current,fields:{LIST:["stack_data",listId]},inputs:{INDEX:this.textIn("last"),ITEM:valueA}});
      const idxB=scritMakeReporter(this,"operator_subtract",{NUM1:this.lengthOfList("stack_data"),NUM2:this.numIn(1)});

function md5svg(str){
  const input=new TextEncoder().encode(String(str));
  const bitLength=input.length*8;
  const total=((input.length+9+63)>>6)<<6;
  const bytes=new Uint8Array(total);bytes.set(input);bytes[input.length]=0x80;
  const view=new DataView(bytes.buffer);
  view.setUint32(total-8,bitLength>>>0,true);
  view.setUint32(total-4,Math.floor(bitLength/0x100000000),true);
  const shifts=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  const constants=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*0x100000000)>>>0);
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  const rot=(x,n)=>(x<<n)|(x>>>(32-n));
  for(let offset=0;offset<total;offset+=64){
    const words=new Uint32Array(16);
    for(let j=0;j<16;j++)words[j]=view.getUint32(offset+j*4,true);
    let a=a0,b=b0,c=c0,d=d0;
    for(let i=0;i<64;i++){
      let f,g,s;
      if(i<16){f=(b&c)|(~b&d);g=i;s=shifts[i%4];}
      else if(i<32){f=(d&b)|(~d&c);g=(5*i+1)%16;s=shifts[4+i%4];}
      else if(i<48){f=b^c^d;g=(3*i+5)%16;s=shifts[8+i%4];}
      else{f=c^(b|~d);g=(7*i)%16;s=shifts[12+i%4];}
      const sum=(a+f+constants[i]+words[g])>>>0;
      const next=(b+rot(sum,s))>>>0;
      a=d;d=c;c=b;b=next;
    }
    a0=(a0+a)>>>0;b0=(b0+b)>>>0;c0=(c0+c)>>>0;d0=(d0+d)>>>0;
  }
  return [a0,b0,c0,d0].map(word=>[0,8,16,24].map(shift=>((word>>>shift)&255).toString(16).padStart(2,"0")).join("")).join("");
}

function blocksToSIR(blocks){
  const sir=[];
  for(const id of Object.keys(blocks)){
    const b=blocks[id];
    if(!b||b.shadow) continue;
    sir.push({
      id, op:b.opcode, next:b.next, parent:b.parent,
      inputs:JSON.parse(JSON.stringify(b.inputs||{})),
      fields:JSON.parse(JSON.stringify(b.fields||{})),
      mutation:b.mutation?JSON.parse(JSON.stringify(b.mutation)):null,
      topLevel:!!b.topLevel, live:true,
      // SSA / analysis fields
      ssaVer:{},          // var -> version at this node (after)
      uses:[], defs:[],
      pulse:0,            // pulse id lattice
      eclass:null,
      folded:null
    });
  }
  return sir;
}
function sirToBlocks(sir, origBlocks){
  const blocks={};
  origBlocks=origBlocks||{};
  for(const n of sir){
    if(!n.live) continue;
    blocks[n.id]={
      opcode:n.op, next:n.next, parent:n.parent,
      inputs:n.inputs||{}, fields:n.fields||{},
      shadow:false, topLevel:n.topLevel,
      ...(n.mutation?{mutation:JSON.parse(JSON.stringify(n.mutation))}:{})
    };
    if(n.topLevel){
      const original=origBlocks[n.id]||{};
      blocks[n.id].x=Number.isFinite(original.x)?original.x:40;
      blocks[n.id].y=Number.isFinite(original.y)?original.y:40;
    }
  }
  for(const n of sir){
    if(!n.live) continue;
    for(const inp of Object.values(n.inputs||{})){
      if(!Array.isArray(inp)) continue;
      for(let i=1;i<inp.length;i++){
        const sid=inp[i];
        if(typeof sid==="string" && origBlocks[sid] && !blocks[sid]){
          try{ blocks[sid]=JSON.parse(JSON.stringify(origBlocks[sid])); }catch(_){}
        }
      }
    }
  }
  const live=new Set(Object.keys(blocks));
  const byId=new Map(sir.map(node=>[node.id,node]));
  for(const id of Object.keys(blocks)){
    if(blocks[id].shadow) continue;
    let n=blocks[id].next;
    let guard=0;
    while(n && !live.has(n) && guard++<10000){
      const dead=byId.get(n);
      n=dead?dead.next:null;
    }
    blocks[id].next=(n && live.has(n))?n:null;
  }
  // Optimizer passes may bypass an empty control block or unroll a one-iteration
  // loop. Reparent its surviving stack children to the nearest live ancestor.
  for(const id of Object.keys(blocks)){
    const block=blocks[id];
    if(block.shadow) continue;
    let parent=block.parent,guard=0;
    while(parent && (!blocks[parent] || blocks[parent].shadow) && guard++<10000){
      const dead=byId.get(parent)||origBlocks[parent];
      parent=dead&&dead.parent?dead.parent:null;
    }
    block.parent=parent && blocks[parent] ? parent : null;
  }
  return blocks;
}

class EGraph {
  constructor(){
    this.parent=new Map(); // id -> id
    this.rank=new Map();
    this.nodes=new Map();  // id -> {op, kids:[eclass], const:v|null}
    this.hash=new Map();   // hash -> eclass root
    this.extra=new Map();  // eclass -> Set of member ids
    this.sat=0;
  }
  find(x){
    if(!this.parent.has(x)){ this.parent.set(x,x); this.rank.set(x,0); this.extra.set(x,new Set([x])); return x; }
    let p=this.parent.get(x);
    if(p!==x){ p=this.find(p); this.parent.set(x,p); }
    return p;
  }
  union(a,b){
    a=this.find(a); b=this.find(b);
    if(a===b) return a;
    const ra=this.rank.get(a)||0, rb=this.rank.get(b)||0;
    if(ra<rb){ const t=a; a=b; b=t; }
    this.parent.set(b,a);
    if(ra===rb) this.rank.set(a,ra+1);
    const ea=this.extra.get(a)||new Set([a]);
    const eb=this.extra.get(b)||new Set([b]);
    for(const m of eb) ea.add(m);
    this.extra.set(a,ea);
    return a;
  }
  add(id, op, kids, cval){
    const k=(kids||[]).map(k=>this.find(k));
    const h=op+"|"+k.join(",")+"|"+(cval===undefined||cval===null?"":String(cval));
    if(this.hash.has(h)){
      const existing=this.hash.get(h);
      this.union(existing, id);
      this.nodes.set(id,{op,kids:k,const:cval??null});
      return this.find(id);
    }
    this.find(id);
    this.nodes.set(id,{op,kids:k,const:cval??null});
    this.hash.set(h,this.find(id));
    return this.find(id);
  }
  getConst(eclass){
    eclass=this.find(eclass);
    const members=this.extra.get(eclass)||new Set([eclass]);
    for(const m of members){
      const n=this.nodes.get(m);
      if(n && n.const!==null && n.const!==undefined) return n.const;
    }
    // also check node itself
    for(const m of members){
      const n=this.nodes.get(m);
      if(n && (n.op==="math_number"||n.op==="const_num") && n.const!==null) return n.const;
    }
    return null;
  }
  // algebraic rewrite rules (e-class saturation)
  saturate(maxIter=64){
    let changed=true; let it=0;
    while(changed && it++<maxIter){
      changed=false; this.sat++;
      const ids=[...this.nodes.keys()];
      for(const id of ids){
        const n=this.nodes.get(id); if(!n) continue;
        const kids=n.kids.map(k=>this.find(k));
        // x+0 = x, x-0 = x, x*1 = x, x*0 = 0, x/1 = x
        if(n.op==="operator_add"||n.op==="operator_subtract"){
          const c1=this.getConst(kids[1]);
          if(c1===0){ this.union(id, kids[0]); changed=true; }
        }
        if(n.op==="operator_multiply"){
          const c1=this.getConst(kids[1]);
          const c0=this.getConst(kids[0]);
          if(c1===1){ this.union(id, kids[0]); changed=true; }
          if(c0===1){ this.union(id, kids[1]); changed=true; }
          if(c1===0||c0===0){
            const z="zc_"+id; this.add(z,"const_num",[],0); this.union(id,z); changed=true;
          }
        }
        if(n.op==="operator_divide"){
          const c1=this.getConst(kids[1]);
          if(c1===1){ this.union(id, kids[0]); changed=true; }
        }
        // const fold binary
        if(/^operator_(add|subtract|multiply|divide|mod|equals|gt|lt)$/.test(n.op)){
          const a=this.getConst(kids[0]), b=this.getConst(kids[1]);
          if(a!==null && b!==null && typeof a==="number" && typeof b==="number"){
            let r=null;
            if(n.op==="operator_add") r=a+b;
            else if(n.op==="operator_subtract") r=a-b;
            else if(n.op==="operator_multiply") r=a*b;
            else if(n.op==="operator_divide" && b!==0) r=a/b;
            else if(n.op==="operator_mod" && b!==0) r=a%b;
            else if(n.op==="operator_equals") r=(a==b)?1:0;
            else if(n.op==="operator_gt") r=(a>b)?1:0;
            else if(n.op==="operator_lt") r=(a<b)?1:0;
            if(r!==null && Number.isFinite(r)){
              const z="cf_"+id; this.add(z,"const_num",[],r); this.union(id,z); changed=true;
            }
          }
        }
        // associativity / commutativity hash rebuild for add/mul
        if(n.op==="operator_add"||n.op==="operator_multiply"){
          // (a+b)+c already handled by recursive const; commute: a+b = b+a
          const h2=n.op+"|"+[kids[1],kids[0]].join(",")+"|";
          if(this.hash.has(h2)){
            this.union(id, this.hash.get(h2)); changed=true;
          } else {
            this.hash.set(h2, this.find(id));
          }
        }
        // not not x = x
        if(n.op==="operator_not"){
          const inner=this.nodes.get(kids[0]);
          if(inner && inner.op==="operator_not"){
            this.union(id, inner.kids[0]); changed=true;
          }
          const c=this.getConst(kids[0]);
          if(c===0){ const z="t_"+id; this.add(z,"const_num",[],1); this.union(id,z); changed=true; }
          if(c===1){ const z="f_"+id; this.add(z,"const_num",[],0); this.union(id,z); changed=true; }
        }
        // and/or with constants
        if(n.op==="operator_and"){
          const a=this.getConst(kids[0]), b=this.getConst(kids[1]);
          if(a===0||b===0){ const z="f_"+id; this.add(z,"const_num",[],0); this.union(id,z); changed=true; }
          else if(a===1 && b===1){ const z="t_"+id; this.add(z,"const_num",[],1); this.union(id,z); changed=true; }
          else if(a===1){ this.union(id,kids[1]); changed=true; }
          else if(b===1){ this.union(id,kids[0]); changed=true; }
        }
        if(n.op==="operator_or"){
          const a=this.getConst(kids[0]), b=this.getConst(kids[1]);
          if(a===1||b===1){ const z="t_"+id; this.add(z,"const_num",[],1); this.union(id,z); changed=true; }
          else if(a===0 && b===0){ const z="f_"+id; this.add(z,"const_num",[],0); this.union(id,z); changed=true; }
          else if(a===0){ this.union(id,kids[1]); changed=true; }
          else if(b===0){ this.union(id,kids[0]); changed=true; }
        }
        // a-a=0, a/a=1
        if((n.op==="operator_subtract"||n.op==="operator_divide") && kids[0]===kids[1]){
          const z="id_"+id;
          this.add(z,"const_num",[], n.op==="operator_subtract"?0:1);
          this.union(id,z); changed=true;
        }
      }
    }
    return this.sat;
  }
}

class SMTLite {
  constructor(){
    this.eq=new Map();   // var -> const | other var
    this.bounds=new Map(); // var -> {lo,hi}
    this.facts=[];       // boolean facts
    this.unsat=false;
  }
  setEq(v, val){
    if(this.eq.has(v) && this.eq.get(v)!==val && typeof this.eq.get(v)==="number" && typeof val==="number"){
      if(this.eq.get(v)!==val) this.unsat=true;
    }
    this.eq.set(v,val);
  }
  getEq(v){ return this.eq.has(v)?this.eq.get(v):null; }
  narrow(v, lo, hi){
    const b=this.bounds.get(v)||{lo:-Infinity,hi:Infinity};
    b.lo=Math.max(b.lo, lo); b.hi=Math.min(b.hi, hi);
    if(b.lo>b.hi) this.unsat=true;
    this.bounds.set(v,b);
    if(b.lo===b.hi && Number.isFinite(b.lo)) this.setEq(v,b.lo);
  }
  assertTrue(exprId){ this.facts.push({id:exprId,val:1}); }
  assertFalse(exprId){ this.facts.push({id:exprId,val:0}); }
  propagate(egraph){
    // push known consts into egraph
    for(const [v,val] of this.eq){
      if(typeof val==="number"){
        const z="smt_"+v;
        egraph.add(z,"const_num",[],val);
        if(egraph.nodes.has(v)) egraph.union(v,z);
      }
    }
    for(const f of this.facts){
      const z="smtf_"+f.id;
      egraph.add(z,"const_num",[],f.val);
      egraph.union(f.id, z);
    }
    return !this.unsat;
  }
}

// Each side-effecting instruction emits a pulse channel.
// Two pulses "collide" (same channel + overlapping live range / control-dependent)
// ⇒ both keep effect. Isolated pulse with proven-false guard ⇒ eliminate.
class PulseSystem {
  constructor(){
    this.channels=new Map(); // channel -> [{id, guard, pulseId}]
    this.next=1;
    this.killed=new Set();
  }
  channelFor(n){
    if(n.op==="data_setvariableto"||n.op==="data_changevariableby")
      return "var:"+(n.fields.VARIABLE?.[0]||"?");
    if(/^data_/.test(n.op) && n.fields.LIST) return "list:"+(n.fields.LIST[0]||"?");
    if(/^motion_/.test(n.op)) return "motion";
    if(/^looks_/.test(n.op)) return "looks";
    if(/^pen_/.test(n.op)) return "pen";
    if(/^sound_/.test(n.op)) return "sound";
    if(n.op==="event_broadcast"||n.op==="event_broadcastandwait") return "broadcast";
    if(n.op==="sensing_askandwait") return "ask";
    if(n.op==="control_wait"||n.op==="control_wait_until") return "wait";
    return "fx:"+n.op;
  }
  emit(n, guard){
    if(!_sirIsSide(n.op) && !/^control_/.test(n.op)) return;
    const ch=this.channelFor(n);
    n.pulse=this.next++;
    if(!this.channels.has(ch)) this.channels.set(ch,[]);
    this.channels.get(ch).push({id:n.id, guard:guard||null, pulseId:n.pulse, node:n});
  }
  // If guard is const false → kill. If only one pulse on channel and pure-dominated → keep.
  // Collision: ≥2 live pulses same channel with compatible guards → both execute.
  resolve(egraph){
    let killed=0;
    for(const [,list] of this.channels){
      const live=list.filter(e=>e.node.live);
      for(const e of live){
        if(e.guard){
          const c=egraph.getConst(e.guard);
          if(c===0){ e.node.live=false; this.killed.add(e.id); killed++; }
        }
      }
    }
    // Re-scan: pulses whose guard is false already dead; pulses with no collision and
    // proven redundant store (same value) handled elsewhere.
    return killed;
  }
}

function buildCFG(sir){
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  const preds=new Map(); const succs=new Map();
  for(const n of sir){ preds.set(n.id,[]); succs.set(n.id,[]); }
  for(const n of sir){
    if(n.next && byId[n.next]){
      succs.get(n.id).push(n.next);
      preds.get(n.next).push(n.id);
    }
    // branch targets
    for(const key of ["SUBSTACK","SUBSTACK2"]){
      const inp=n.inputs[key];
      if(Array.isArray(inp) && typeof inp[1]==="string" && byId[inp[1]]){
        succs.get(n.id).push(inp[1]);
        preds.get(inp[1]).push(n.id);
      }
    }
  }
  const entries=sir.filter(n=>n.topLevel||_sirIsHat(n.op)).map(n=>n.id);
  return {byId,preds,succs,entries};
}

function constructSSA(sir, level){
  const {byId,preds,succs,entries}=buildCFG(sir);
  // Collect variables defined
  const vars=new Set();
  for(const n of sir){
    if(n.op==="data_setvariableto"||n.op==="data_changevariableby"){
      const v=n.fields.VARIABLE?.[0]; if(v) vars.add(v);
    }
  }
  // Simple dominance frontier approximation: stack-based renaming along chains
  const version=new Map(); // var -> current version
  for(const v of vars) version.set(v,0);
  const defSite=new Map(); // "var#ver" -> node id
  const stack=[];
  const seen=new Set();
  for(const e of entries) stack.push(e);
  while(stack.length){
    const id=stack.pop();
    if(seen.has(id)) continue;
    seen.add(id);
    const n=byId[id]; if(!n||!n.live) continue;
    // use: data_variable reporters are in inputs of consumers; track defs
    if(n.op==="data_setvariableto"||n.op==="data_changevariableby"){
      const v=n.fields.VARIABLE?.[0];
      if(v){
        const ver=(version.get(v)||0)+1;
        version.set(v,ver);
        n.ssaDef=v+"#"+ver;
        n.ssaVer={...n.ssaVer,[v]:ver};
        defSite.set(n.ssaDef, n.id);
        n.defs=[v];
      }
    }
    // read uses from inputs referencing data_variable shadows — approximate via fields
    for(const [k,inp] of Object.entries(n.inputs||{})){
      // skip
    }
    for(const s of (succs.get(id)||[])) stack.push(s);
  }
  // Phi insertion at join points (nodes with ≥2 preds)
  const phis=[];
  for(const [id,plist] of preds){
    if(plist.length<2) continue;
    const n=byId[id]; if(!n) continue;
    for(const v of vars){
      // if different versions flow in, mark phi need
      phis.push({at:id, var:v});
    }
  }
  return {version, defSite, phis, byId, preds, succs, entries};
}

// Models each pure data update as affine: x := A x + b
// repeat N:  x ← A x + b   ⇒   x ← A^N x + (A^{N-1}+...+I) b
// dim≤3, const N → closed form O(1) Scratch ops
// non-const N, pure additive → O(1) multiply; general linear → binary exp O(log N) blocks

function _collectChain(byId, headId){
  const nodes=[]; let id=headId; let g=0;
  while(id && byId[id] && g++<100000){
    const n=byId[id];
    if(n.live) nodes.push(n);
    id=n.next;
  }
  return nodes;
}
function _killChain(byId, headId, stats){
  let id=headId; let g=0; let k=0;
  while(id && byId[id] && g++<100000){
    if(byId[id].live){ byId[id].live=false; k++; }
    id=byId[id].next;
  }
  if(stats) stats.dead=(stats.dead||0)+k;
  return k;
}

// Affine map on ordered var list: x' = A x + b  (row-major A)
function _matId(n){ const M=[]; for(let i=0;i<n;i++){ const r=[]; for(let j=0;j<n;j++) r.push(i===j?1:0); M.push(r);} return M; }
function _matMul(A,B){
  const n=A.length, m=B[0].length, p=B.length;
  const C=Array.from({length:n},()=>Array(m).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<m;j++){ let s=0; for(let k=0;k<p;k++) s+=A[i][k]*B[k][j]; C[i][j]=s; }
  return C;
}
function _matVec(A,v){ return A.map(row=>row.reduce((s,a,j)=>s+a*v[j],0)); }
function _matPow(A,n){
  let R=_matId(A.length), P=A.map(r=>r.slice());
  n=Math.floor(n);
  if(n<0) return R;
  while(n>0){
    if(n&1) R=_matMul(R,P);
    P=_matMul(P,P);
    n>>=1;
  }
  return R;
}
// sum I + A + A^2 + ... + A^{n-1}
function _matSeries(A,n){
  const d=A.length;
  if(n<=0) return Array.from({length:d},()=>Array(d).fill(0));
  // efficient: if A is scalar-like use formula; else iterative for modest n, or
  // S = (A^n - I) * inv(A-I) when invertible — fallback loop for n up to 1e6 via doubling
  let S=_matId(d); // will compute properly
  // Doubling formula for geometric series of matrices:
  // S_{2k} = S_k + A^k S_k ; S_{2k+1} = S_{2k} + A^{2k}
  let base=A.map(r=>r.slice());
  let sum=_matId(d); // S_1 = I  for n>=1 contributions of A^0
  // Actually sum_{i=0}^{n-1} A^i
  sum=Array.from({length:d},(_,i)=>Array.from({length:d},(_,j)=>i===j?1:0));
  if(n===1) return sum;
  // binary method
  function seriesPow(M, exp){
    // returns [M^exp, sum_{i=0}^{exp-1} M^i]
    if(exp===0) return [_matId(d), Array.from({length:d},()=>Array(d).fill(0))];
    if(exp===1) return [M.map(r=>r.slice()), _matId(d)];
    if(exp%2===0){
      const [Mk,Sk]=seriesPow(M, exp/2);
      // M^{2k}=Mk*Mk ; S_{2k}=Sk + Mk*Sk
      return [_matMul(Mk,Mk), _matAdd(Sk, _matMul(Mk,Sk))];
    } else {
      const [Mm,Sm]=seriesPow(M, exp-1);
      return [_matMul(Mm,M), _matAdd(Sm, Mm)];
    }
  }
  return seriesPow(A, n)[1];
}
function _matAdd(A,B){ return A.map((r,i)=>r.map((v,j)=>v+B[i][j])); }
function _matSub(A,B){ return A.map((r,i)=>r.map((v,j)=>v-B[i][j])); }

// Analyze a straight-line pure-data body into affine update on vars
// Returns null if body has non-summarizable side effects (motion/pen/ask/wait/broadcast/lists/branches)
function _bodyToAffine(bodyNodes, blocks){
  // allowed: data_setvariableto, data_changevariableby with affine RHS of tracked vars + consts
  const order=[]; const idx=new Map();
  function touch(v){ if(v && !idx.has(v)){ idx.set(v, order.length); order.push(v); } }

  // First pass: which vars are written
  for(const n of bodyNodes){
    if(!n.live) continue;
    if(n.op==="data_setvariableto"||n.op==="data_changevariableby"){
      touch(n.fields.VARIABLE?.[0]);
    } else if(n.op==="math_number"||n.op==="text"||n.op==="data_variable"||/^operator_/.test(n.op)){
      // pure ok if only as input
    } else if(_sirIsHat(n.op)){
      return null;
    } else if(n.op==="control_repeat"||n.op==="control_forever"||n.op==="control_if"||n.op==="control_if_else"||n.op==="control_repeat_until"){
      return null; // nested control — don't summarize
    } else if(_sirIsSide(n.op)){
      return null; // motion/pen/etc — keep loop
    } else {
      // unknown
      return null;
    }
  }
  if(!order.length) return {order:[], A:null, b:null, empty:true};

  const dim=order.length;
  // Start with identity; apply each statement as affine transform composition
  let A=_matId(dim);
  let b=Array(dim).fill(0);

  function readCoeff(inp){
    // returns vector c[dim] and const k  such that value = c·x + k
    const r={c:Array(dim).fill(0), k:0, ok:true};
    if(!Array.isArray(inp)){ r.ok=false; return r; }
    // shadow number
    const cst=_constFromBlocks(inp, blocks);
    if(cst.ok && cst.kind==="num"){ r.k=cst.v; return r; }
    // reporter block id
    const id=typeof inp[1]==="string"?inp[1]:null;
    if(!id){ r.ok=false; return r; }
    const bnode=blocks[id];
    if(!bnode){ r.ok=false; return r; }
    if(bnode.opcode==="math_number"){ r.k=Number(bnode.fields.NUM?.[0])||0; return r; }
    if(bnode.opcode==="data_variable"){
      const vn=bnode.fields.VARIABLE?.[0];
      if(idx.has(vn)){ r.c[idx.get(vn)]=1; return r; }
      // external var treated as const unknown — abort
      r.ok=false; return r;
    }
    if(bnode.opcode==="operator_add"||bnode.opcode==="operator_subtract"||bnode.opcode==="operator_multiply"){
      const L=readCoeff(bnode.inputs.NUM1);
      const R=readCoeff(bnode.inputs.NUM2);
      if(!L.ok||!R.ok){ r.ok=false; return r; }
      if(bnode.opcode==="operator_add"){
        r.c=L.c.map((v,i)=>v+R.c[i]); r.k=L.k+R.k; return r;
      }
      if(bnode.opcode==="operator_subtract"){
        r.c=L.c.map((v,i)=>v-R.c[i]); r.k=L.k-R.k; return r;
      }
      // multiply: only if one side is pure const
      const lConst=L.c.every(x=>x===0), rConst=R.c.every(x=>x===0);
      if(lConst){ r.c=R.c.map(v=>v*L.k); r.k=R.k*L.k; return r; }
      if(rConst){ r.c=L.c.map(v=>v*R.k); r.k=L.k*R.k; return r; }
      r.ok=false; return r; // bilinear — not affine
    }
    r.ok=false; return r;
  }

  for(const n of bodyNodes){
    if(!n.live) continue;
    if(n.op==="data_setvariableto"){
      const v=n.fields.VARIABLE?.[0];
      if(!idx.has(v)) continue;
      const i=idx.get(v);
      const coeff=readCoeff(n.inputs.VALUE);
      if(!coeff.ok) return null;
      // x_i := coeff.c · x + coeff.k
      // New transform T: replace row i
      // Compose T ∘ current: A,b
      // x' = T(A x + b) = T_A (A x + b) + T_b
      const TA=_matId(dim);
      const Tb=Array(dim).fill(0);
      TA[i]=coeff.c.slice();
      Tb[i]=coeff.k;
      // for rows != i, TA is identity row — already
      A=_matMul(TA, A);
      b=_matVec(TA, b);
      for(let j=0;j<dim;j++) b[j]+=Tb[j];
    } else if(n.op==="data_changevariableby"){
      const v=n.fields.VARIABLE?.[0];
      if(!idx.has(v)) continue;
      const i=idx.get(v);
      const coeff=readCoeff(n.inputs.VALUE);
      if(!coeff.ok) return null;
      // x_i := x_i + (c·x + k)
      const TA=_matId(dim);
      const Tb=Array(dim).fill(0);
      for(let j=0;j<dim;j++) TA[i][j]+=coeff.c[j];
      Tb[i]=coeff.k;
      A=_matMul(TA, A);
      b=_matVec(TA, b);
      for(let j=0;j<dim;j++) b[j]+=Tb[j];
    }
  }
  return {order, A, b, empty:false, dim};
}

function _emitSetVar(sir, blocks, varName, valueInput, parent, prev){
  const id="cf_"+Math.random().toString(36).slice(2,10);
  // ensure var exists in some block fields — use name only
  const node={
    id, op:"data_setvariableto", next:null, parent:parent||null,
    inputs:{VALUE:valueInput},
    fields:{VARIABLE:[varName, "v_"+varName]},
    topLevel:false, live:true, ssaVer:{}, uses:[], defs:[varName], pulse:0, eclass:null, folded:null
  };
  sir.push(node);
  blocks[id]={
    opcode:"data_setvariableto", next:null, parent:parent||null,
    inputs:{VALUE:valueInput}, fields:{VARIABLE:[varName, "v_"+varName]},
    shadow:false, topLevel:false
  };
  if(prev){
    const p=sir.find(n=>n.id===prev);
    if(p) p.next=id;
    if(blocks[prev]) blocks[prev].next=id;
  }
  return id;
}
function _emitNum(blocks, parent, v){
  return _makeConstInput(blocks, v, "num", parent);
}
function _emitOp(blocks, parent, op, aInp, bInp){
  const id="op_"+Math.random().toString(36).slice(2,10);
  const inputs=op.startsWith("operator_") && (op.includes("add")||op.includes("subtract")||op.includes("multiply")||op.includes("divide")||op.includes("mod"))
    ? {NUM1:aInp, NUM2:bInp}
    : {OPERAND1:aInp, OPERAND2:bInp};
  blocks[id]={opcode:op, next:null, parent:parent||null, inputs, fields:{}, shadow:false, topLevel:false};
  // attach child parents
  for(const inp of Object.values(inputs)){
    if(Array.isArray(inp) && typeof inp[1]==="string" && blocks[inp[1]]) blocks[inp[1]].parent=id;
  }
  return [3, id, typeof aInp[1]==="string"?aInp[1]:null];
}
function _emitVarReporter(blocks, parent, varName){
  const id="vr_"+Math.random().toString(36).slice(2,10);
  blocks[id]={opcode:"data_variable", next:null, parent:parent||null, inputs:{}, fields:{VARIABLE:[varName,"v_"+varName]}, shadow:false, topLevel:false};
  return [3, id, null];
}

// Build Scratch expression for (A^n * x + S*b)_i as blocks, using current var values
function _emitAffineClosedForm(sir, blocks, parent, prev, order, An, Sb){
  // For each var i: new_i = sum_j An[i][j]*var_j + Sb[i]
  // Emit from high dependency carefully — use temps if needed; simple sequential with temps
  const dim=order.length;
  const temps=order.map((v,i)=>"__cf_"+i+"_"+Math.random().toString(36).slice(2,6));
  let last=prev;
  // first compute all new values into temps (read all old)
  for(let i=0;i<dim;i++){
    let expr=null;
    // sum An[i][j]*x_j
    for(let j=0;j<dim;j++){
      const coef=An[i][j];
      if(Math.abs(coef)<1e-12) continue;
      let term=_emitVarReporter(blocks, parent, order[j]);
      if(Math.abs(coef-1)>1e-12){
        term=_emitOp(blocks, parent, "operator_multiply", _emitNum(blocks, parent, coef), term);
      }
      expr = expr==null ? term : _emitOp(blocks, parent, "operator_add", expr, term);
    }
    const add=Sb[i];
    if(expr==null){
      expr=_emitNum(blocks, parent, add||0);
    } else if(Math.abs(add)>1e-12){
      expr=_emitOp(blocks, parent, "operator_add", expr, _emitNum(blocks, parent, add));
    }
    last=_emitSetVar(sir, blocks, temps[i], expr, parent, last);
  }
  // write temps back to real vars
  for(let i=0;i<dim;i++){
    last=_emitSetVar(sir, blocks, order[i], _emitVarReporter(blocks, parent, temps[i]), parent, last);
  }
  return last;
}

// O(log n) binary exponentiation for 1D: x = a*x + b  repeated N times (N runtime)
// closed form still O(1): x = a^N * x + b*(a^N-1)/(a-1)
// For a==1: x = x + b*N
// Emit O(1) formula using Scratch operators when possible; for a^N use loop logN only if needed
function _emit1DClosedRuntime(sir, blocks, parent, prev, varName, a, b, nInput){
  // nInput is a block input for N
  let last=prev;
  if(Math.abs(a-1)<1e-12){
    // x := x + b*N
    let term=nInput;
    if(Math.abs(b-1)>1e-12){
      term=_emitOp(blocks, parent, "operator_multiply", _emitNum(blocks, parent, b), nInput);
    }
    const sum=_emitOp(blocks, parent, "operator_add", _emitVarReporter(blocks, parent, varName), term);
    last=_emitSetVar(sir, blocks, varName, sum, parent, last);
    return last;
  }
  // general: need a^N — emit binary power into temp __pow
  // __pow=1; __base=a; __e=N; while e>0: if e%2: pow*=base; base*=base; e//=2
  // Scratch has no while with int ops easily — use control_repeat with bit length ~32 or log via repeated
  // Practical: emit fixed 32-step binary exponentiation (always O(1) bound, O(32) blocks)
  const pow="__pow", base="__base", e="__e", t="__t";
  last=_emitSetVar(sir, blocks, pow, _emitNum(blocks, parent, 1), parent, last);
  last=_emitSetVar(sir, blocks, base, _emitNum(blocks, parent, a), parent, last);
  last=_emitSetVar(sir, blocks, e, nInput, parent, last);
  // 32 iterations
  const repId="rep_"+Math.random().toString(36).slice(2,10);
  const timesInp=_emitNum(blocks, parent, 32);
  blocks[repId]={opcode:"control_repeat",next:null,parent:parent||null,inputs:{TIMES:timesInp},fields:{},shadow:false,topLevel:false};
  const repNode={id:repId,op:"control_repeat",next:null,parent:parent||null,inputs:{TIMES:timesInp},fields:{},topLevel:false,live:true,ssaVer:{},uses:[],defs:[],pulse:0,eclass:null,folded:null};
  sir.push(repNode);
  if(last){ const p=sir.find(n=>n.id===last); if(p) p.next=repId; if(blocks[last]) blocks[last].next=repId; }
  // body: if e mod 2 == 1: pow = pow * base
  // base = base * base; e = floor(e/2)
  // Use change/set sequence as flat body (approximate with always multiply when bit set via (e mod 2))
  let bodyPrev=null;
  // __t = e % 2
  const mod=_emitOp(blocks, repId, "operator_mod", _emitVarReporter(blocks, repId, e), _emitNum(blocks, repId, 2));
  // pow = pow * ( (base-1)*__t + 1 )  => if t=1 multiply by base else by 1
  const bm1=_emitOp(blocks, repId, "operator_subtract", _emitVarReporter(blocks, repId, base), _emitNum(blocks, repId, 1));
  const bmt=_emitOp(blocks, repId, "operator_multiply", bm1, mod);
  const mulF=_emitOp(blocks, repId, "operator_add", bmt, _emitNum(blocks, repId, 1));
  const newPow=_emitOp(blocks, repId, "operator_multiply", _emitVarReporter(blocks, repId, pow), mulF);
  bodyPrev=_emitSetVar(sir, blocks, pow, newPow, repId, bodyPrev);
  const base2=_emitOp(blocks, repId, "operator_multiply", _emitVarReporter(blocks, repId, base), _emitVarReporter(blocks, repId, base));
  bodyPrev=_emitSetVar(sir, blocks, base, base2, repId, bodyPrev);
  const e2=_emitOp(blocks, repId, "operator_divide", _emitVarReporter(blocks, repId, e), _emitNum(blocks, repId, 2));
  // floor via floor mathop if available — use round-down
  const floorId="fl_"+Math.random().toString(36).slice(2,8);
  blocks[floorId]={opcode:"operator_mathop",next:null,parent:repId,inputs:{NUM:e2},fields:{OPERATOR:["floor",null]},shadow:false,topLevel:false};
  bodyPrev=_emitSetVar(sir, blocks, e, [3,floorId,null], repId, bodyPrev);
  if(bodyPrev) repNode.inputs.SUBSTACK=[2, bodyPrev];
  blocks[repId].inputs.SUBSTACK=[2, bodyPrev];
  last=repId;
  // x = pow * x + b * (pow - 1) / (a - 1)
  const px=_emitOp(blocks, parent, "operator_multiply", _emitVarReporter(blocks, parent, pow), _emitVarReporter(blocks, parent, varName));
  const pm1=_emitOp(blocks, parent, "operator_subtract", _emitVarReporter(blocks, parent, pow), _emitNum(blocks, parent, 1));
  const geom=_emitOp(blocks, parent, "operator_divide", pm1, _emitNum(blocks, parent, a-1));
  const bgeom=_emitOp(blocks, parent, "operator_multiply", _emitNum(blocks, parent, b), geom);
  const total=_emitOp(blocks, parent, "operator_add", px, bgeom);
  last=_emitSetVar(sir, blocks, varName, total, parent, last);
  return last;
}

function summarizeAndCollapseLoops(sir, blocks, level, stats){
  if(level<1) return 0;
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  let collapsed=0;
  // iterate over snapshot of control_repeat nodes
  const repeats=sir.filter(n=>n.live && n.op==="control_repeat");
  for(const rep of repeats){
    if(!rep.live) continue;
    const times=_constFromBlocks(rep.inputs.TIMES, blocks);
    const sub=rep.inputs.SUBSTACK;
    if(!Array.isArray(sub) || typeof sub[1]!=="string") continue;
    const body=_collectChain(byId, sub[1]);
    if(!body.length){
      // empty loop — kill
      rep.live=false; stats.dead++; collapsed++; continue;
    }
    const aff=_bodyToAffine(body, blocks);
    if(!aff) continue; // has side effects — leave
    if(aff.empty){
      _killChain(byId, sub[1], stats);
      rep.live=false; stats.dead++; collapsed++; continue;
    }
    const {order, A, b, dim}=aff;
    // Only collapse when affine is well-defined
    if(times.ok && times.kind==="num"){
      let N=Math.floor(Number(times.v));
      if(N<0) N=0;
      if(N===0){
        _killChain(byId, sub[1], stats);
        rep.live=false; stats.dead++; collapsed++; continue;
      }
      // Cap insane const unroll analysis
      if(N>1e7) N=1e7;
      const An=_matPow(A, N);
      const S=_matSeries(A, N);
      const Sb=_matVec(S, b);
      _killChain(byId, sub[1], stats);
      let pred=null;
      for(const n of sir){
        if(n.live && n.next===rep.id){ pred=n; break; }
      }
      // also: SUBSTACK parents pointing at rep
      let subParent=null; let subKey=null;
      for(const n of sir){
        if(!n.live) continue;
        for(const key of ["SUBSTACK","SUBSTACK2"]){
          const inp=n.inputs[key];
          if(Array.isArray(inp) && inp[1]===rep.id){ subParent=n; subKey=key; }
        }
      }
      const parent=rep.parent;
      const tail=rep.next;
      const last=_emitAffineClosedForm(sir, blocks, parent, pred?pred.id:null, order, An, Sb);
      // find head of emitted chain (first new node after pred or first cf_)
      let head=last;
      if(pred && pred.next) head=pred.next;
      else {
        // no pred: head is first set emitted — search temps for this batch
        const emitted=sir.filter(n=>n.live && n.op==="data_setvariableto" && n.id.startsWith("cf_"));
        if(emitted.length) head=emitted[emitted.length-1].id; // wrong
        // better: emit returns last; re-walk: nodes with no live pred among new
        head=last;
        for(const n of sir){
          if(n.live && n.next===last) head=n.id;
        }
        // climb
        let changed=true;
        while(changed){
          changed=false;
          for(const n of sir){
            if(n.live && n.next===head && n.id.startsWith("cf_")){ head=n.id; changed=true; }
          }
        }
      }
      const lastNode=sir.find(n=>n.id===last);
      if(lastNode) lastNode.next=tail||null;
      if(blocks[last]) blocks[last].next=tail||null;
      if(pred){
        // emitAffine already linked pred.next -> first
        let c=pred; let g=0;
        while(c && c.next && g++<2000){
          const nx=sir.find(n=>n.id===c.next);
          if(!nx||!nx.live) break;
          c=nx;
        }
        c.next=tail||null;
        if(blocks[c.id]) blocks[c.id].next=tail||null;
      } else if(subParent && subKey){
        subParent.inputs[subKey]=[2, head];
        if(blocks[subParent.id]) blocks[subParent.id].inputs[subKey]=[2, head];
        const lastN=sir.find(n=>n.id===last);
        if(lastN) lastN.next=tail||null;
      } else {
        // rep was top-level next of a hat
        for(const n of sir){
          if(n.live && (_sirIsHat(n.op)||n.topLevel) && n.next===rep.id){
            n.next=head;
            if(blocks[n.id]) blocks[n.id].next=head;
          }
        }
      }
      rep.live=false; stats.dead++;
      stats.linear=(stats.linear||0)+1;
      collapsed++;
      for(const n of sir) byId[n.id]=n;
    } else if(level>=2 && dim===1){
      // Runtime N: 1D closed form / log
      const a=A[0][0], bv=b[0];
      const varName=order[0];
      const nInput=rep.inputs.TIMES;
      _killChain(byId, sub[1], stats);
      let pred=null;
      for(const n of sir){ if(n.live && n.next===rep.id){ pred=n; break; } }
      const parent=rep.parent;
      const tail=rep.next;
      const last=_emit1DClosedRuntime(sir, blocks, parent, pred?pred.id:null, varName, a, bv, nInput);
      const lastNode=sir.find(n=>n.id===last);
      if(lastNode) lastNode.next=tail||null;
      if(blocks[last]) blocks[last].next=tail||null;
      if(pred){
        let c=pred; let g=0;
        while(c && c.next && g++<2000){
          const nx=sir.find(n=>n.id===c.next);
          if(!nx) break;
          c=nx;
        }
        c.next=tail||null;
        if(blocks[c.id]) blocks[c.id].next=tail||null;
      }
      rep.live=false; stats.dead++;
      stats.linear=(stats.linear||0)+1;
      collapsed++;
      for(const n of sir) byId[n.id]=n;
    } else if(level>=3 && dim>=2 && dim<=3 && times.ok){
      // already handled by const path
    }
  }
  return collapsed;
}

function solveLinearChains(sir, blocks, level){
  let folded=0;
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  const starts=sir.filter(n=>n.topLevel||_sirIsHat(n.op));
  for(const start of starts){
    const state=new Map();
    let cur=start;
    let guard=0;
    while(cur && guard++<50000){
      if(!cur.live){ cur=byId[cur.next]; continue; }
      if(cur.op==="data_setvariableto"){
        const v=cur.fields.VARIABLE?.[0];
        const c=_constFromBlocks(cur.inputs.VALUE, blocks);
        if(v && c.ok && c.kind==="num"){
          const prev=state.get(v);
          if(prev && prev.node && prev.node.live && prev.node!==cur){
            if(prev.node.next===cur.id){ prev.node.live=false; folded++; }
          }
          state.set(v,{base:c.v, node:cur});
        } else if(v){
          state.delete(v);
        }
      } else if(cur.op==="data_changevariableby"){
        const v=cur.fields.VARIABLE?.[0];
        const c=_constFromBlocks(cur.inputs.VALUE, blocks);
        const st=v?state.get(v):null;
        if(v && c.ok && c.kind==="num" && st && typeof st.base==="number"){
          const neu=st.base+c.v;
          st.node.inputs.VALUE=_makeConstInput(blocks, neu, "num", st.node.id);
          st.base=neu;
          cur.live=false; folded++;
          state.set(v,st);
        } else if(v){
          state.delete(v);
        }
      } else if(cur.op==="control_if"||cur.op==="control_if_else"||cur.op==="control_repeat"||cur.op==="control_forever"||cur.op==="control_repeat_until"){
        state.clear();
      }
      cur=byId[cur.next];
    }
  }
  return folded;
}

function reachabilityDCE(sir){
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  const reach=new Set();
  const stack=sir.filter(n=>n.topLevel||_sirIsHat(n.op)).map(n=>n.id);
  while(stack.length){
    const id=stack.pop();
    if(reach.has(id)) continue;
    reach.add(id);
    const n=byId[id]; if(!n) continue;
    if(n.next) stack.push(n.next);
    for(const inp of Object.values(n.inputs||{})){
      if(Array.isArray(inp)) for(let i=1;i<inp.length;i++) if(typeof inp[i]==="string") stack.push(inp[i]);
    }
  }
  let dead=0;
  for(const n of sir){
    if(!reach.has(n.id) && !n.topLevel && !_sirIsHat(n.op)){
      if(n.live){ n.live=false; dead++; }
    }
  }
  return dead;
}

function countLive(sir){ let n=0; for(const x of sir) if(x.live) n++; return n; }

function passEmptyControlElim(sir, stats){
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  let k=0;
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="control_repeat"||n.op==="control_forever"||n.op==="control_repeat_until"||n.op==="control_if"||n.op==="control_if_else"){
      const sub=n.inputs.SUBSTACK;
      const has=Array.isArray(sub)&&typeof sub[1]==="string"&&byId[sub[1]]&&byId[sub[1]].live;
      const sub2=n.inputs.SUBSTACK2;
      const has2=Array.isArray(sub2)&&typeof sub2[1]==="string"&&byId[sub2[1]]&&byId[sub2[1]].live;
      if(n.op==="control_if" && !has){ n.live=false; k++; }
      else if(n.op==="control_if_else" && !has && !has2){ n.live=false; k++; }
      else if(n.op==="control_if_else" && !has && has2){ n.next=sub2[1]; n.live=false; k++; }
      else if((n.op==="control_repeat"||n.op==="control_forever"||n.op==="control_repeat_until")&&!has){ n.live=false; k++; }
    }
  }
  stats.dead+=k; return k;
}

function passStrengthReduction(sir, blocks, stats){
  let k=0;
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="operator_multiply"){
      const a=_constFromBlocks(n.inputs.NUM1, blocks);
      const b=_constFromBlocks(n.inputs.NUM2, blocks);
      if(a.ok && a.v===2 && !b.ok){
        n.op="operator_add"; n.inputs={NUM1:n.inputs.NUM2, NUM2:n.inputs.NUM2}; k++; stats.folded++;
      } else if(b.ok && b.v===2 && !a.ok){
        n.op="operator_add"; n.inputs={NUM1:n.inputs.NUM1, NUM2:n.inputs.NUM1}; k++; stats.folded++;
      } else if((a.ok && a.v===0)||(b.ok && b.v===0)){
        n.op="math_number"; n.fields={NUM:["0",null]}; n.inputs={}; k++; stats.folded++;
        blocks[n.id]={opcode:"math_number",next:null,parent:n.parent,inputs:{},fields:{NUM:["0",null]},shadow:false,topLevel:false};
      }
    }
    if(n.op==="operator_add"){
      const a=_constFromBlocks(n.inputs.NUM1, blocks);
      const b=_constFromBlocks(n.inputs.NUM2, blocks);
      if(a.ok && a.v===0){ /* keep as identity via egraph already */ }
    }
    if(n.op==="data_changevariableby"){
      const c=_constFromBlocks(n.inputs.VALUE, blocks);
      if(c.ok && c.v===0){ n.live=false; k++; stats.dead++; }
    }
  }
  return k;
}

function passCopyProp(sir, blocks, stats){
  const byId=Object.fromEntries(sir.map(n=>[n.id,n]));
  const aliases=new Map();
  let k=0;
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="data_setvariableto"){
      const v=n.fields.VARIABLE?.[0];
      const inp=n.inputs.VALUE;
      if(v && Array.isArray(inp) && typeof inp[1]==="string" && blocks[inp[1]] && blocks[inp[1]].opcode==="data_variable"){
        const src=blocks[inp[1]].fields.VARIABLE?.[0];
        if(src && src!==v) aliases.set(v, src);
      } else if(v){
        aliases.delete(v);
      }
    } else if(n.op==="data_changevariableby"){
      const v=n.fields.VARIABLE?.[0]; if(v) aliases.delete(v);
    }
  }
  stats.cse+=aliases.size;
  return aliases.size;
}

function passWaitZeroElim(sir, blocks, stats){
  let k=0;
  for(const n of sir){
    if(!n.live) continue;
    if(n.op==="control_wait"){
      const c=_constFromBlocks(n.inputs.DURATION, blocks);
      if(c.ok && Number(c.v)===0){ n.live=false; k++; stats.dead++; }
